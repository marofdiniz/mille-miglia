// ---------- CONTAS: A RECEBER ----------
function renderReceber(d) {
  const h = hojeISO();
  const k = Financeiro.chaveMes(d.anoAtual, d.mesAtual);
  const ps = state.parcelas;
  const doMes = ps.filter(p => Financeiro.chaveMes(p.ano, p.mes) === k && p.status !== 'cancelado');
  const vencidas = ps.filter(p => p.status === 'pendente' && p.vencimento < h);
  const filtro = state.filtroReceber;
  const lista = ps.filter(p => filtro === 'todas' ? true : filtro === 'pagas' ? p.status === 'pago' : filtro === 'vencidas' ? (p.status === 'pendente' && p.vencimento < h) : p.status === 'pendente')
    .sort((a, b) => filtro === 'pagas' ? String(b.vencimento).localeCompare(a.vencimento) : String(a.vencimento).localeCompare(b.vencimento));
  const linhas = lista.map(p => {
    const lancada = p.status === 'pendente' ? Financeiro.receitaJaLancada(p, state.receitas) : null;
    const atraso = p.status === 'pendente' && p.vencimento < h ? Math.round((new Date(h) - new Date(p.vencimento)) / 864e5) : 0;
    return td(`<div class="num-mono">${dataBR(p.vencimento)}</div>${atraso ? `<div class="text-xs font-semibold" style="color:#c62828">${atraso} dia(s) de atraso</div>` : ''}`)
      + td(`<div class="font-semibold" style="color:#1a3a2a">${escapeHtml(p.descricao)}</div><div class="text-xs text-stone-500">${escapeHtml(p.imovel)}${p.terceiros ? ' · 👤 ' + escapeHtml(nomePessoa(p.proprietario_id) || 'terceiro') : ''}</div>`)
      + td(escapeHtml(p.cliente_nome || nomePessoa(p.cliente_id) || '—'), 'text-stone-600')
      + td(formatBRL(p.status === 'pago' && p.valor_pago != null ? p.valor_pago : p.valor), 'text-right num-mono accent font-semibold')
      + td(statusParcela(p) + (lancada ? `<div class="text-xs mt-1" style="color:#854d0e">já tem receita de ${formatBRL(lancada.valor)} no mês</div>` : ''), 'text-center')
      + td(`<div class="flex gap-2 justify-end flex-wrap">${p.status === 'pendente'
          ? (lancada ? `<button onclick="vincularParcela('${p.id}','${lancada.id}')" class="px-3 py-1.5 text-xs font-semibold rounded-md" style="background:#fef3c7;color:#854d0e;border:1px solid #fcd34d" title="Marca a parcela como recebida usando a receita que já foi lançada, sem lançar de novo">Vincular</button>` : '')
            + `<button onclick="abrirBaixa('${p.id}')" class="px-3 py-1.5 text-xs font-semibold rounded-md" style="background:#1a4d3a;color:#fdfbf6">${icons.check} Receber</button>`
            + `<button onclick="cancelarParcela('${p.id}')" class="p-1.5 rounded hover:bg-red-100 text-red-700" title="Cancelar parcela">${icons.trash}</button>`
          : p.status === 'pago' ? `<button onclick="desfazerBaixa('${p.id}')" class="px-3 py-1.5 text-xs font-semibold rounded-md hover:bg-stone-100" style="color:#8b3a3a" title="Apaga a receita e o repasse gerados e volta a parcela para pendente">Desfazer</button>`
          : `<button onclick="reabrirParcela('${p.id}')" class="px-3 py-1.5 text-xs font-semibold rounded-md hover:bg-stone-100" style="color:#1a4d3a">Reabrir</button>`}</div>`);
  });
  const filtros = [{ k: 'pendentes', l: 'A receber' }, { k: 'vencidas', l: `Vencidas (${vencidas.length})` }, { k: 'pagas', l: 'Recebidas' }, { k: 'todas', l: 'Todas' }];
  return `<main class="max-w-7xl mx-auto px-6 py-8"><div class="space-y-6">
    ${titulo('A receber', 'Parcelas geradas pelos contratos: aluguel todo mês e comissões de venda.', botao('🔄 Gerar parcelas', 'gerarParcelasUI()') + botao('Contratos →', "setAba('contratos')"))}
    <div class="grid grid-cols-1 md:grid-cols-3 gap-5">
      ${cartao(`A receber · ${MESES[d.mesAtual - 1]}/${d.anoAtual}`, formatBRL(doMes.filter(p => p.status === 'pendente').reduce((s, p) => s + p.valor, 0)), `${doMes.filter(p => p.status === 'pendente').length} parcela(s)`, '#1a4d3a', true)}
      ${cartao('Recebido no mês', formatBRL(doMes.filter(p => p.status === 'pago').reduce((s, p) => s + (p.valor_pago ?? p.valor), 0)), `${doMes.filter(p => p.status === 'pago').length} de ${doMes.length} parcela(s)`)}
      ${cartao('Em atraso (todas)', formatBRL(vencidas.reduce((s, p) => s + p.valor, 0)), `${vencidas.length} parcela(s) vencida(s)`, '#8b3a3a')}
    </div>
    <div class="flex gap-2 flex-wrap">${filtros.map(f => `<button onclick="setFiltroReceber('${f.k}')" class="pill" style="cursor:pointer;${filtro === f.k ? 'background:#1a4d3a;color:#fdfbf6' : 'background:#f5e6d8;color:#6b4423;border:1px solid #d4b896'}">${f.l}</button>`).join('')}</div>
    ${tabela(th('Vencimento') + th('Parcela') + th('Inquilino / comprador') + th('Valor', 'right') + th('Situação', 'center') + '<th></th>', linhas, state.contratos.length ? 'Nenhuma parcela aqui.' : 'Cadastre os contratos (aba Contratos) para as parcelas aparecerem aqui.', 6)}
  </div></main>`;
}

function renderModalBaixa() {
  const m = state.modalBaixa;
  const p = state.parcelas.find(x => x.id === m.id);
  if (!p) return '';
  const c = state.contratos.find(x => x.id === p.contrato_id);
  const prev = Financeiro.baixaParcela(p, c, { data: m.data, valor: Number(m.valor) });
  const linha = (t, v, cor) => `<div class="flex justify-between text-sm py-1"><span>${t}</span><span class="num-mono font-semibold" style="color:${cor}">${formatBRL(v)}</span></div>`;
  return `<div class="fixed inset-0 modal-overlay z-50 flex items-center justify-center p-4" onclick="if(event.target===this)fecharModaisFin()">
    <div class="card rounded-xl max-w-lg w-full" style="background:#fdfbf6">
      <div class="flex justify-between items-center p-6 border-b" style="border-color:#e8dfc9"><div><h3 class="titulo-serif text-2xl font-bold" style="color:#1a3a2a">Receber parcela</h3><p class="text-sm text-stone-500">${escapeHtml(p.descricao)} · ${escapeHtml(p.imovel)} · vence ${dataBR(p.vencimento)}</p></div><button onclick="fecharModaisFin()">${icons.x}</button></div>
      <div class="p-6 space-y-4">
        <div class="grid grid-cols-2 gap-4">
          ${field('Data em que entrou', `<input id="bx-data" type="date" class="input" value="${m.data}" onchange="atualizarBaixa()"/>`)}
          ${field('Valor recebido (R$)', `<input id="bx-valor" type="number" step="0.01" class="input" value="${m.valor}" onchange="atualizarBaixa()"/>`)}
        </div>
        <div class="rounded-lg p-4" style="background:#f5f1e8;border:1px solid #e8dfc9">
          <div class="text-xs uppercase tracking-wider font-semibold mb-2" style="color:#5d4037">O que vai ser lançado</div>
          ${prev.receitas.map(r => linha(r.terceiros ? '🔒 Conta de terceiros (dinheiro do proprietário)' : '➕ Receita da empresa · ' + escapeHtml(Financeiro.conta(r.categoria).nome), r.valor, r.terceiros ? '#1e3a5f' : '#1a4d3a')).join('')}
          ${prev.despesas.map(x => linha(`➖ ${x.categoria === 'ter_repasse' ? 'Repasse a pagar ao proprietário' : 'Comissão a pagar ao corretor'} · dia ${String(x.dia_venc).padStart(2, '0')}/${String(x.mes).padStart(2, '0')}`, x.valor, '#8b3a3a')).join('')}
        </div>
      </div>
      <div class="flex justify-end gap-3 p-6 border-t" style="border-color:#e8dfc9"><button onclick="fecharModaisFin()" class="px-5 py-2 rounded-md text-sm font-semibold text-stone-700 hover:bg-stone-100">Cancelar</button><button onclick="confirmarBaixa()" ${m.salvando ? 'disabled' : ''} class="px-5 py-2 rounded-md text-sm font-semibold text-amber-50" style="background:#1a4d3a">${m.salvando ? 'Lançando...' : '✓ Confirmar recebimento'}</button></div>
    </div></div>`;
}

// ---------- CONTAS: TERCEIROS ----------
function renderTerceiros(d) {
  const t = Financeiro.contaTerceiros(state.receitas, state.despesas);
  const repasses = state.despesas.filter(x => Financeiro.categoriaDespesa(x) === 'ter_repasse').sort((a, b) => (a.status === 'pago') - (b.status === 'pago') || (b.ano - a.ano) || (b.mes - a.mes));
  const entradas = state.receitas.filter(r => Financeiro.categoriaReceita(r) === 'ter_recebido').sort((a, b) => String(b.recebido_em).localeCompare(a.recebido_em)).slice(0, 30);
  const linhasRep = repasses.map(x => td(`${String(x.dia_venc).padStart(2, '0')}/${String(x.mes).padStart(2, '0')}/${x.ano}`, 'num-mono')
    + td(`<div class="font-semibold" style="color:#1a3a2a">${escapeHtml(nomePessoa(x.proprietario_id) || 'Proprietário')}</div><div class="text-xs text-stone-500">${escapeHtml(x.imovel)}</div>`)
    + td(escapeHtml(pessoaPorId(x.proprietario_id)?.pix || '—'), 'text-xs text-stone-600')
    + td(formatBRL(x.valor), 'text-right num-mono font-semibold" style="color:#8b3a3a')
    + td(`<button onclick="marcarPaga('${x.id}','${x.status}')" class="pill ${x.status === 'pago' ? 'badge-pago' : 'badge-urgente'}">${x.status === 'pago' ? icons.check + ' Repassado' : 'A repassar'}</button>`, 'text-center'));
  const linhasEnt = entradas.map(r => td(dataBR(r.recebido_em), 'num-mono') + td(escapeHtml(r.imovel), 'font-semibold') + td(escapeHtml(nomePessoa(r.proprietario_id) || '—'), 'text-stone-600') + td(formatBRL(r.valor), 'text-right num-mono font-semibold" style="color:#1e3a5f'));
  return `<main class="max-w-7xl mx-auto px-6 py-8"><div class="space-y-6">
    ${titulo('Conta de terceiros', 'O dinheiro do aluguel de imóvel de terceiro não é da empresa: entra aqui, a taxa sai para o caixa da empresa e o resto é repassado ao proprietário.')}
    <div class="grid grid-cols-1 md:grid-cols-4 gap-5">
      ${cartao('Saldo de terceiros', formatBRL(t.saldo), 'deveria estar guardado para repassar', '#1e3a5f', true)}
      ${cartao('A repassar', formatBRL(t.aRepassar), 'repasses pendentes', '#8b3a3a')}
      ${cartao('Já repassado', formatBRL(t.repassado), 'desde o início')}
      ${cartao('Taxas da empresa', formatBRL(t.taxas), 'administração e 1ª locação')}
    </div>
    <h3 class="titulo-serif text-2xl font-bold" style="color:#1a3a2a">Repasses aos proprietários</h3>
    ${tabela(th('Data') + th('Proprietário') + th('Pix / banco') + th('Valor', 'right') + th('Situação', 'center'), linhasRep, 'Nenhum repasse ainda. Eles aparecem quando você recebe o aluguel de um imóvel de terceiro.', 5)}
    <h3 class="titulo-serif text-2xl font-bold" style="color:#1a3a2a">Últimas entradas de inquilinos</h3>
    ${tabela(th('Data') + th('Imóvel') + th('Proprietário') + th('Valor', 'right'), linhasEnt, 'Nenhuma entrada ainda.', 4)}
  </div></main>`;
}

// ---------- RELATÓRIOS ----------
function renderRelatorios(d) {
  const subs = [
    { id: 'geral', label: 'Comparativo' }, { id: 'fluxo', label: 'Fluxo de caixa' }, { id: 'dre', label: 'DRE' },
    { id: 'proprietario', label: 'Extrato do proprietário' }, { id: 'inadimplencia', label: 'Inadimplência' }, { id: 'comissoes', label: 'Comissões' },
  ];
  const s = state.subRel;
  const corpo = s === 'fluxo' ? renderFluxo(d) : s === 'dre' ? renderDRE(d) : s === 'proprietario' ? renderExtratoProprietario(d)
    : s === 'inadimplencia' ? renderInadimplencia(d) : s === 'comissoes' ? renderComissoes(d) : renderComparativo(d) + renderGraficos(d);
  return `<div class="max-w-7xl mx-auto px-6 pt-6">${abasInternas(subs, s, 'setSubRel')}</div>` + corpo;
}

// ---------- AÇÕES ----------
async function gravar(colecao, id, dados) {
  const fb = window.firebaseDB;
  if (id) await fb.setDoc(fb.doc(fb.db, colecao, id), dados);
  else return (await fb.addDoc(fb.collection(fb.db, colecao), dados)).id;
  return id;
}
async function apagar(colecao, id) { const fb = window.firebaseDB; await fb.deleteDoc(fb.doc(fb.db, colecao, id)); }
async function atualizar(colecao, id, dados) { const fb = window.firebaseDB; await fb.updateDoc(fb.doc(fb.db, colecao, id), dados); }

// Acha a pessoa pelo nome (sem diferenciar maiúsculas) ou cria; garante o papel.
async function pessoaPeloNome(nome, papel) {
  nome = (nome || '').trim();
  if (!nome) return '';
  let p = state.pessoas.find(x => x.nome.trim().toLowerCase() === nome.toLowerCase());
  if (!p) {
    const dados = { nome, papeis: [papel] };
    const id = await gravar('pessoas', null, dados);
    p = { id, ...dados }; state.pessoas.push(p);
  } else if (!(p.papeis || []).includes(papel)) {
    p.papeis = [...(p.papeis || []), papel];
    await atualizar('pessoas', p.id, { papeis: p.papeis });
  }
  return p.id;
}

// Cria as parcelas que faltam (aluguel do mês atual e do próximo). Não mexe nas que já existem.
async function gerarParcelas(contratos = state.contratos) {
  const hoje = { mes: HOJE.getMonth() + 1, ano: HOJE.getFullYear() };
  let criadas = 0;
  for (let i = 0; i <= 1; i++) {
    for (const p of Financeiro.planejarParcelas(contratos, state.parcelas, Financeiro.somarMes(hoje, i))) {
      const { id, ...dados } = p;
      await gravar('parcelas', id, { ...dados, criado_por: 'app' });
      state.parcelas.push(p); criadas++;
    }
  }
  return criadas;
}

window.confirmarSalvarContrato = async () => {
  const m = state.modalContrato;
  const g = id => (document.getElementById(id) || {}).value?.trim() ?? '';
  const n = id => parseFloat(g(id)) || 0;
  const loc = m.tipo === 'locacao';
  const imovel = g('ct-imovel');
  if (!imovel) { alert('Escolha o imóvel.'); return; }
  const im = state.imoveis.find(i => i.nome === imovel) || {};
  try {
    const c = { tipo: m.tipo, imovel, empresa: g('ct-empresa') || im.empresa || '', ativo: document.getElementById('ct-ativo').checked, obs: g('ct-obs') };
    c.cliente_nome = g('ct-cliente');
    c.cliente_id = await pessoaPeloNome(c.cliente_nome, loc ? 'inquilino' : 'comprador');
    if (loc) {
      Object.assign(c, { aluguel: n('ct-aluguel'), encargos: n('ct-encargos'), dia_vencimento: parseInt(g('ct-dia')) || 1, inicio: g('ct-inicio'), fim: g('ct-fim'),
        terceiros: document.getElementById('ct-terceiros').checked, taxa_adm_pct: n('ct-adm'), taxa_1a_pct: n('ct-1a'), dia_repasse: parseInt(g('ct-repasse')) || 0 });
      if (!c.inicio) { alert('Preencha o mês de início.'); return; }
      c.proprietario_id = c.terceiros ? await pessoaPeloNome(g('ct-proprietario'), 'proprietario') : '';
      if (c.terceiros && !c.proprietario_id) { alert('Digite o nome do proprietário.'); return; }
    } else {
      Object.assign(c, { valor_venda: n('ct-venda'), comissao_pct: n('ct-com'), parcelas: parseInt(g('ct-parc')) || 1, primeiro_venc: g('ct-venc'), corretor_pct: n('ct-corpct') });
      c.corretor_id = await pessoaPeloNome(g('ct-corretor'), 'corretor');
      if (c.corretor_id && !c.corretor_pct) c.corretor_pct = Number(pessoaPorId(c.corretor_id)?.comissao_pct) || 0;
    }
    const id = await gravar('contratos', m.id, c);
    c.id = id;
    // Parcelas pendentes deste contrato são refeitas com os dados novos; as já recebidas ficam como estão.
    const minhas = state.parcelas.filter(p => p.contrato_id === id);
    const kHoje = Financeiro.chaveMes(HOJE.getFullYear(), HOJE.getMonth() + 1);
    if (loc) {
      for (const p of minhas.filter(p => p.status === 'pendente' && Financeiro.chaveMes(p.ano, p.mes) >= kHoje)) {
        await apagar('parcelas', p.id); state.parcelas = state.parcelas.filter(x => x.id !== p.id);
      }
      if (c.ativo) await gerarParcelas([c]);
    } else {
      const novas = c.ativo ? Financeiro.parcelasVenda(c) : [];
      for (const p of minhas.filter(p => p.status === 'pendente' && !novas.some(x => x.id === p.id))) await apagar('parcelas', p.id);
      for (const p of novas) {
        const atual = minhas.find(x => x.id === p.id);
        if (atual && atual.status !== 'pendente') continue;
        const { id: pid, ...dados } = p; await gravar('parcelas', pid, dados);
      }
    }
    state.modalContrato = null;
    await carregarDados();
  } catch (e) { alert('Erro ao salvar: ' + e.message); console.error(e); }
};
window.removerContrato = async id => {
  const pend = state.parcelas.filter(p => p.contrato_id === id && p.status === 'pendente');
  if (!confirm(`Remover este contrato?${pend.length ? `\n\nAs ${pend.length} parcela(s) ainda não recebidas também saem. O que já foi recebido continua nas receitas.` : ''}`)) return;
  try { for (const p of pend) await apagar('parcelas', p.id); await apagar('contratos', id); await carregarDados(); } catch (e) { alert('Erro: ' + e.message); }
};
window.importarContratos = async () => {
  const hoje = { mes: HOJE.getMonth() + 1, ano: HOJE.getFullYear() };
  const novos = Financeiro.contratosDosImoveis(state.imoveis, state.contratos, hoje);
  if (!novos.length) return;
  if (!confirm(`Criar ${novos.length} contrato(s) de locação a partir dos imóveis alugados?\n\n${novos.map(c => `• ${c.imovel} · ${c.cliente_nome} · ${formatBRL(c.aluguel)}`).join('\n')}\n\nEles entram como imóvel próprio, começando em ${MESES[hoje.mes - 1]}/${hoje.ano}. Se algum for de terceiro, edite depois e marque "Imóvel de terceiro".`)) return;
  try {
    const criados = [];
    for (const c of novos) {
      const im = state.imoveis.find(i => i.nome === c.imovel) || {};
      c.cliente_id = await pessoaPeloNome(c.cliente_nome, 'inquilino');
      const p = pessoaPorId(c.cliente_id);
      // traz o contato do inquilino que já estava no imóvel
      const extra = {};
      if (im.inquilino_doc && !p.doc) extra.doc = im.inquilino_doc;
      if (im.inquilino_whatsapp && !p.whatsapp) extra.whatsapp = im.inquilino_whatsapp;
      if (im.inquilino_email && !p.email) extra.email = im.inquilino_email;
      if (Object.keys(extra).length) await atualizar('pessoas', c.cliente_id, extra);
      c.id = await gravar('contratos', null, c);
      criados.push(c);
    }
    const n = await gerarParcelas(criados);
    await carregarDados();
    alert(`✅ ${criados.length} contrato(s) criado(s) e ${n} parcela(s) de aluguel geradas.\n\nSe o aluguel do mês já tinha sido lançado (extrato ou cobrança), use "Vincular" em Contas › A receber para não contar duas vezes.`);
  } catch (e) { alert('Erro: ' + e.message); }
};
window.gerarParcelasUI = async () => {
  try {
    const n = await gerarParcelas();
    await carregarDados();
    alert(n ? `✅ ${n} parcela(s) criada(s).` : 'Tudo em dia: as parcelas deste mês e do próximo já existem.');
  } catch (e) { alert('Erro: ' + e.message); }
};

window.abrirBaixa = id => { const p = state.parcelas.find(x => x.id === id); state.modalBaixa = { id, data: hojeISO(), valor: p.valor }; render(); };
window.atualizarBaixa = () => { state.modalBaixa.data = document.getElementById('bx-data').value; state.modalBaixa.valor = parseFloat(document.getElementById('bx-valor').value) || 0; render(); };
async function baixarParcela(id, { data, valor, extrato_id }) {
  const p = state.parcelas.find(x => x.id === id);
  const c = state.contratos.find(x => x.id === p.contrato_id);
  const b = Financeiro.baixaParcela(p, c, { data, valor });
  for (const r of b.receitas) await gravar('receitas', null, extrato_id && r.categoria !== 'rec_adm' && r.categoria !== 'rec_1locacao' ? { ...r, extrato_id } : r);
  for (const d of b.despesas) await gravar('despesas', null, d);
  await atualizar('parcelas', id, { status: 'pago', pago_em: data, valor_pago: Number(valor) });
}
window.confirmarBaixa = async () => {
  const m = state.modalBaixa;
  if (!m.data || !(m.valor > 0)) { alert('Preencha a data e o valor.'); return; }
  m.salvando = true; render();
  try { await baixarParcela(m.id, m); state.modalBaixa = null; await carregarDados(); }
  catch (e) { m.salvando = false; render(); alert('Erro: ' + e.message); }
};
window.vincularParcela = async (pid, rid) => {
  const r = state.receitas.find(x => x.id === rid);
  if (!confirm(`Marcar a parcela como recebida usando a receita de ${formatBRL(r.valor)} que já foi lançada?`)) return;
  try {
    await atualizar('receitas', rid, { parcela_id: pid, categoria: 'rec_aluguel' });
    await atualizar('parcelas', pid, { status: 'pago', pago_em: r.recebido_em || hojeISO(), valor_pago: Number(r.valor), receita_id: rid });
    await carregarDados();
  } catch (e) { alert('Erro: ' + e.message); }
};
window.desfazerBaixa = async id => {
  const recs = state.receitas.filter(r => r.parcela_id === id);
  const desps = state.despesas.filter(d => d.parcela_id === id);
  const pagas = desps.filter(d => d.status === 'pago');
  if (pagas.length && !confirm(`Atenção: ${pagas.length} repasse/comissão desta parcela já foi marcado como pago. Desfazer apaga mesmo assim.`)) return;
  if (!confirm('Desfazer o recebimento? A parcela volta para pendente e as receitas, repasses e comissões gerados por ela são apagados.')) return;
  try {
    // receita que só foi vinculada (lançada antes à mão) não é apagada, só desvinculada
    for (const r of recs) { if (r.origem === 'parcela') await apagar('receitas', r.id); else await atualizar('receitas', r.id, { parcela_id: '' }); }
    for (const d of desps) await apagar('despesas', d.id);
    await atualizar('parcelas', id, { status: 'pendente', pago_em: '', valor_pago: null, receita_id: '' });
    await carregarDados();
  } catch (e) { alert('Erro: ' + e.message); }
};
window.cancelarParcela = async id => { if (!confirm('Cancelar esta parcela? (ex.: aluguel que não vai ser cobrado)')) return; try { await atualizar('parcelas', id, { status: 'cancelado' }); await carregarDados(); } catch (e) { alert('Erro: ' + e.message); } };
window.reabrirParcela = async id => { try { await atualizar('parcelas', id, { status: 'pendente' }); await carregarDados(); } catch (e) { alert('Erro: ' + e.message); } };
// === FIM DAS TELAS DO FINANCEIRO ===


// === TELA DE CONFERIR EXTRATO ===
function renderModalExtrato() {
  const m = state.modalExtrato;
  const linhas = m.linhas || [];
  const pend = linhas.filter(l => !l.jaConciliado);
  const marcadas = pend.filter(l => l.escolha);
  const corValor = v => v > 0 ? '#065f46' : '#991b1b';
  return `<div class="fixed inset-0 modal-overlay z-50 flex items-center justify-center p-4" onclick="if(event.target===this)fecharModalExtrato()">
    <div class="card rounded-xl max-w-5xl w-full max-h-[90vh] overflow-y-auto" style="background:#fdfbf6">
      <div class="flex justify-between items-start p-6 border-b" style="border-color:#e8dfc9">
        <div>
          <h3 class="titulo-serif text-2xl font-bold" style="color:#1a3a2a">🏦 Conferir extrato do banco</h3>
          <p class="text-sm text-stone-500 mt-1">Suba o extrato do C6 (OFX ou CSV). O app reconhece aluguéis que entraram e contas que saíram. Você confere e confirma.</p>
        </div>
        <button onclick="fecharModalExtrato()">${icons.x}</button>
      </div>
      <div class="p-6 space-y-4">
        <label class="block rounded-lg p-4 text-center cursor-pointer hover:bg-amber-50" style="border:2px dashed #d4c5a0">
          <input type="file" accept=".ofx,.csv,.txt" class="hidden" onchange="onExtratoSelecionado(event)"/>
          <span class="text-sm font-semibold" style="color:#1a4d3a">${m.arquivo ? '📄 ' + escapeHtml(m.arquivo) + ' · trocar arquivo' : '📂 Escolher arquivo do extrato'}</span>
          <span class="block text-xs text-stone-500 mt-1">No C6 Empresas: Extrato › Exportar › OFX (ou CSV)</span>
        </label>
        ${m.erro ? `<div class="rounded-lg p-3 text-sm" style="background:#fee2e2;color:#991b1b">${escapeHtml(m.erro)}</div>` : ''}
        ${linhas.length ? `
          <p class="text-sm text-stone-600">${linhas.length} movimentação(ões) · ${linhas.length - pend.length} já conferida(s) antes · <strong>${marcadas.length} para lançar</strong></p>
          <div class="overflow-x-auto"><table class="w-full text-sm">
            <thead><tr class="text-left text-xs uppercase tracking-wider" style="color:#5d4037"><th class="py-2 pr-3">Data</th><th class="py-2 pr-3">Descrição</th><th class="py-2 pr-3 text-right">Valor</th><th class="py-2">O que é</th></tr></thead>
            <tbody>
            ${linhas.map((l, i) => `<tr class="border-t" style="border-color:#e8dfc9;${l.jaConciliado ? 'opacity:.45' : ''}">
              <td class="py-2 pr-3 num-mono whitespace-nowrap">${l.data.split('-').reverse().join('/')}</td>
              <td class="py-2 pr-3 text-stone-700">${escapeHtml(l.desc)}</td>
              <td class="py-2 pr-3 text-right num-mono font-semibold whitespace-nowrap" style="color:${corValor(l.valor)}">${formatBRL(l.valor)}</td>
              <td class="py-2" style="min-width:280px">${l.jaConciliado ? '<span class="pill badge-pago">✓ já lançado</span>' : `
                <select class="input" onchange="escolherExtrato(${i}, this.value)" style="${l.escolha ? 'border-color:#1a4d3a;background:#ecfdf5' : ''}">
                  <option value="">— Ignorar —</option>
                  ${l.opcoes.map(o => `<option value="${escapeHtml(o.chave)}" ${o.chave === l.escolha ? 'selected' : ''}>${escapeHtml(o.rotulo)}</option>`).join('')}
                </select>`}</td>
            </tr>`).join('')}
            </tbody>
          </table></div>` : ''}
      </div>
      <div class="flex justify-end gap-3 p-6 border-t" style="border-color:#e8dfc9">
        <button onclick="fecharModalExtrato()" class="px-5 py-2 rounded-md text-sm font-semibold text-stone-700 hover:bg-stone-100">Cancelar</button>
        ${marcadas.length ? `<button onclick="confirmarExtrato()" ${m.salvando ? 'disabled' : ''} class="px-5 py-2 rounded-md text-sm font-semibold text-amber-50" style="background:#1a4d3a">${m.salvando ? 'Lançando...' : `✓ Lançar ${marcadas.length} item(ns)`}</button>` : ''}
      </div>
    </div>
  </div>`;
}

// Entradas do extrato também podem ser parcelas a receber dos contratos (aluguel, comissão de venda).
// Valor igual e vencimento perto (até 20 dias) vira sugestão; parcela tem prioridade sobre "aluguel do imóvel".
function sugerirParcelas(linhas) {
  const pend = state.parcelas.filter(p => p.status === 'pendente');
  const usadas = new Set();
  const dias = (a, b) => Math.abs(Math.round((new Date(a + 'T12:00:00') - new Date(b + 'T12:00:00')) / 864e5));
  for (const l of linhas) {
    if (l.jaConciliado || !(l.valor > 0)) continue;
    const cands = pend.map(p => ({ p, dist: dias(l.data, p.vencimento), exato: Math.abs(p.valor - l.valor) <= 0.01 }))
      .filter(c => c.dist <= 60).sort((a, b) => (b.exato - a.exato) || (a.dist - b.dist));
    l.opcoes = [...cands.map(c => ({ chave: 'parc:' + c.p.id, rotulo: `📄 ${c.p.descricao} · ${c.p.imovel}${c.p.cliente_nome ? ' (' + c.p.cliente_nome + ')' : ''} · vence ${dataBR(c.p.vencimento)} · ${formatBRL(c.p.valor)}${c.exato ? '' : ' (valor diferente)'}` })), ...l.opcoes];
    const exatos = cands.filter(c => c.exato && c.dist <= 20 && !usadas.has(c.p.id));
    if (exatos.length === 1 || (exatos.length > 1 && exatos[0].dist < exatos[1].dist)) { l.sugestao = 'parc:' + exatos[0].p.id; usadas.add(exatos[0].p.id); }
  }
}

window.abrirModalExtrato = () => { state.modalExtrato = { linhas: [] }; render(); };
window.fecharModalExtrato = () => { state.modalExtrato = null; render(); };
window.onExtratoSelecionado = async (event) => {
  const f = event.target.files[0];
  if (!f) return;
  const buf = await f.arrayBuffer();
  let txt = new TextDecoder('utf-8').decode(buf);
  if (txt.includes('�')) txt = new TextDecoder('iso-8859-1').decode(buf); // extratos antigos em Latin-1
  try {
    const trans = Conciliacao.ler(txt, f.name);
    if (!trans.length) throw new Error('Não encontrei movimentações nesse arquivo.');
    const linhas = Conciliacao.sugerir(trans, { imoveis: state.imoveis, receitas: state.receitas, despesas: state.despesas });
    sugerirParcelas(linhas);
    linhas.forEach(l => { l.escolha = l.sugestao; });
    state.modalExtrato = { arquivo: f.name, linhas };
  } catch (e) {
    state.modalExtrato = { arquivo: f.name, linhas: [], erro: e.message };
  }
  render();
};
window.escolherExtrato = (i, v) => {
  const m = state.modalExtrato;
  // a mesma despesa não pode ser usada por duas movimentações
  if ((v.startsWith('desp:') || v.startsWith('parc:')) && m.linhas.some((l, j) => j !== i && l.escolha === v)) {
    alert('Esse item já foi escolhido para outra movimentação deste extrato.');
  } else m.linhas[i].escolha = v;
  render();
};
window.confirmarExtrato = async () => {
  const m = state.modalExtrato;
  const fb = window.firebaseDB;
  const itens = m.linhas.filter(l => !l.jaConciliado && l.escolha);
  m.salvando = true; render();
  let rec = 0, desp = 0;
  try {
    for (const l of itens) {
      const [ano, mes] = l.data.split('-').map(Number);
      if (l.escolha.startsWith('rec:')) {
        const imovel = l.escolha.slice(4);
        await fb.addDoc(fb.collection(fb.db, 'receitas'), { imovel, mes, ano, valor: l.valor, extrato_id: l.id, recebido_em: l.data, origem: 'extrato' });
        rec++;
      } else if (l.escolha.startsWith('parc:')) {
        await baixarParcela(l.escolha.slice(5), { data: l.data, valor: l.valor, extrato_id: l.id });
        rec++;
      } else if (l.escolha.startsWith('desp:')) {
        const id = l.escolha.slice(5);
        const d = state.despesas.find(x => x.id === id);
        const pago = -l.valor;
        const dados = { status: 'pago', extrato_id: l.id, pago_em: l.data };
        if (d && Math.abs(Number(d.valor) - pago) > 0.01) { dados.valor = pago; dados.valor_previsto = Number(d.valor); }
        if (d && d.confirmar_valor) dados.confirmar_valor = false;
        await fb.updateDoc(fb.doc(fb.db, 'despesas', id), dados);
        desp++;
      }
    }
    state.modalExtrato = null;
    await carregarDados();
    alert(`✅ Pronto!\n\n${rec} aluguel(éis) lançado(s) como receita\n${desp} despesa(s) marcada(s) como paga(s)`);
  } catch (e) {
    m.salvando = false; render();
    alert('Erro ao lançar: ' + e.message + `\n\n${rec + desp} item(ns) já tinham sido lançados. Se subir o mesmo extrato de novo, eles aparecem como "já lançado".`);
  }
};

// === INIT ===
// Só entra quem tem login (Firebase Authentication › E-mail/senha).
function aoMudarAuth() {
  if (window.usuario) carregarDados();
  else renderLogin();
}
function renderLogin(msg) {
  document.getElementById('app').innerHTML = `<div class="min-h-screen flex items-center justify-center p-6">
    <form class="card rounded-xl p-8 w-full max-w-sm space-y-4" onsubmit="event.preventDefault(); entrar()">
      <div class="flex items-center gap-3">
        <div class="w-12 h-12 rounded-lg accent-bg flex items-center justify-center text-amber-100">${icons.building}</div>
        <div><h1 class="titulo-serif text-3xl font-bold" style="color:#1a3a2a;line-height:1">PJ Gestão de Imóveis</h1></div>
      </div>
      ${msg ? `<div class="rounded-md p-3 text-sm" style="background:#fee2e2;color:#991b1b">${escapeHtml(msg)}</div>` : ''}
      ${field('E-mail', '<input id="lg-email" type="email" autocomplete="username" class="input" required/>')}
      ${field('Senha', '<input id="lg-senha" type="password" autocomplete="current-password" class="input" required/>')}
      <button class="w-full accent-bg text-amber-50 py-2.5 rounded-md text-sm font-semibold">Entrar</button>
      <button type="button" onclick="esqueciSenha()" class="w-full text-xs text-stone-500 hover:underline">Esqueci a senha</button>
    </form></div>`;
}
function traduzErroDados(msg) {
  const m = String(msg || '');
  if (/permission|insufficient/i.test(m)) return 'Seu login não tem permissão para ver os dados. Clique em "Sair e entrar de novo". Se continuar, avise quem administra o app.';
  if (/offline|network|unavailable|Failed to fetch/i.test(m)) return 'Sem conexão com a internet (ou o Firebase não respondeu). Confira a internet e tente de novo.';
  return m;
}
function traduzErroLogin(e) {
  const c = e.code || '';
  if (c.includes('invalid-email')) return 'Esse e-mail não parece válido. Confira se digitou certo.';
  if (c.includes('user-disabled')) return 'Esse usuário está desativado no Firebase. Peça para reativar.';
  if (c.includes('invalid') || c.includes('wrong-password') || c.includes('user-not-found')) return 'E-mail ou senha incorretos. Se acabou de trocar a senha, use a senha nova (a do link do e-mail). Se não lembrar, clique em "Esqueci a senha".';
  if (c.includes('operation-not-allowed')) return 'O login por e-mail ainda não foi ligado no Firebase.';
  if (c.includes('too-many-requests')) return 'Muitas tentativas erradas. O Firebase bloqueou por alguns minutos. Espere uns 15 minutos ou troque a senha em "Esqueci a senha".';
  if (c.includes('network-request-failed')) return 'Sem conexão com a internet. Confira a internet e tente de novo.';
  return 'Não consegui entrar: ' + (e.message || c);
}
window.entrar = async () => {
  const fa = window.firebaseAuth;
  try {
    await fa.signInWithEmailAndPassword(fa.auth, document.getElementById('lg-email').value.trim(), document.getElementById('lg-senha').value);
  } catch (e) {
    const email = document.getElementById('lg-email').value;
    renderLogin(traduzErroLogin(e));
    document.getElementById('lg-email').value = email;
  }
};
window.esqueciSenha = async () => {
  const email = (document.getElementById('lg-email').value || '').trim();
  if (!email) { alert('Digite seu e-mail primeiro.'); return; }
  try { await window.firebaseAuth.sendPasswordResetEmail(window.firebaseAuth.auth, email); alert('Pronto! Se esse e-mail tiver acesso, chega em alguns minutos um link para criar uma nova senha (olhe também o spam). Abra o link, crie a senha nova (mínimo 6 caracteres) e volte aqui para entrar com ela.'); }
  catch (e) { alert(traduzErroLogin(e)); }
};
window.sair = async () => { await window.firebaseAuth.signOut(window.firebaseAuth.auth); };
function init() {
  if (!window.firebaseReady || !window.authPronto) { setTimeout(init, 100); return; }
  aoMudarAuth();
  window.addEventListener('auth-changed', aoMudarAuth);
}
init();
</script>
