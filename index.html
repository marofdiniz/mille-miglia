// === FIREBASE OPS ===
async function carregarDados() {
  state.carregando = true;
  state.erro = null;
  render();
  try {
    const fb = window.firebaseDB;
    const [imSnap, recSnap, despSnap, pesSnap, conSnap, parSnap] = await Promise.all([
      fb.getDocs(fb.collection(fb.db, "imoveis")),
      fb.getDocs(fb.collection(fb.db, "receitas")),
      fb.getDocs(fb.collection(fb.db, "despesas")),
      fb.getDocs(fb.collection(fb.db, "pessoas")),
      fb.getDocs(fb.collection(fb.db, "contratos")),
      fb.getDocs(fb.collection(fb.db, "parcelas")),
    ]);
    state.pessoas = pesSnap.docs.map(d => ({ id: d.id, ...d.data() }));
    state.contratos = conSnap.docs.map(d => ({ id: d.id, ...d.data() }));
    state.parcelas = parSnap.docs.map(d => ({ id: d.id, ...d.data() }));
    state.imoveis = imSnap.docs.map(d => ({ id: d.id, ...d.data() }));
    state.receitas = recSnap.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => (b.ano - a.ano) || (b.mes - a.mes));
    state.despesas = despSnap.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => (b.ano - a.ano) || (b.mes - a.mes));
  } catch (e) {
    console.error(e);
    state.erro = e.message;
  } finally {
    state.carregando = false;
    render();
    // Carrega contagens de anexos em background (não trava a UI)
    carregarContagemAnexos();
    carregarContagemDocumentos();
  }
}

async function salvarImovel(im) {
  try {
    const fb = window.firebaseDB;
    const dados = {
      nome: im.nome, endereco: im.endereco || "", tipo: im.tipo, inquilino: im.inquilino || "",
      aluguel: Number(im.aluguel) || 0, condominio: Number(im.condominio) || 0,
      condominio_pago_por: im.condominio_pago_por, iptu: Number(im.iptu) || 0,
      iptu_pago_por: im.iptu_pago_por, taxa_adm: Number(im.taxa_adm) || 0,
      dia_vencimento: Number(im.dia_vencimento) || 1, status: im.status, obs: im.obs || "",
      empresa: (im.empresa || "").trim(),
      cobranca_auto: !!im.cobranca_auto,
      inquilino_doc: im.inquilino_doc || "", inquilino_whatsapp: im.inquilino_whatsapp || "",
      inquilino_email: im.inquilino_email || "",
      cep: im.cep || "", cidade: im.cidade || "", uf: (im.uf || "").toUpperCase(),
    };
    if (im.id) await fb.updateDoc(fb.doc(fb.db, "imoveis", im.id), dados);
    else await fb.addDoc(fb.collection(fb.db, "imoveis"), dados);
    state.modalImovel = null;
    await carregarDados();
  } catch (e) { alert("Erro ao salvar: " + e.message); }
}

async function removerImovel(id) {
  if (!confirm("Remover este imóvel?")) return;
  try {
    const fb = window.firebaseDB;
    await fb.deleteDoc(fb.doc(fb.db, "imoveis", id));
    await carregarDados();
  } catch (e) { alert("Erro: " + e.message); }
}

async function salvarDespesa(d) {
  try {
    const fb = window.firebaseDB;
    const dados = {
      imovel: d.imovel, tipo: d.tipo, mes: Number(d.mes), ano: Number(d.ano),
      dia_venc: Number(d.dia_venc), valor: Number(d.valor), status: d.status,
      pago_por: d.pago_por || 'proprietario',
      recorrente: !!d.recorrente,
      confirmar_valor: !!d.confirmar_valor,
      categoria: d.categoria || Financeiro.categoriaDespesa(d),
    };
    let novoId = d.id;
    let ehNova = false;
    if (d.id) {
      await fb.updateDoc(fb.doc(fb.db, "despesas", d.id), dados);
    } else {
      const docRef = await fb.addDoc(fb.collection(fb.db, "despesas"), dados);
      novoId = docRef.id;
      ehNova = true;
    }
    state.modalDespesa = null;
    await carregarDados();
    // Se for despesa nova, oferecer anexar
    if (ehNova) {
      const querAnexar = confirm(`✅ Despesa criada!\n\nQuer anexar o boleto/comprovante agora?\n\nSe clicar em OK, vai abrir a tela de anexos. Se cancelar, você pode anexar depois pelo botão 📎 nas listas.`);
      if (querAnexar) {
        state.modalAnexos = { tipo: 'despesa', id: novoId, nome: `${dados.tipo} - ${dados.imovel}` };
        render();
        await listarAnexos('despesa', novoId);
        render();
      }
    }
  } catch (e) { alert("Erro: " + e.message); }
}

async function removerDespesa(id) {
  if (!confirm("Remover esta despesa?")) return;
  try {
    const fb = window.firebaseDB;
    await fb.deleteDoc(fb.doc(fb.db, "despesas", id));
    await carregarDados();
  } catch (e) { alert("Erro: " + e.message); }
}

// Gera despesas recorrentes para o mês/ano alvo (se ainda não existirem)
// Detecta automaticamente despesas que se repetem (mesmo imóvel+tipo em vários meses) e oferece marcar como recorrentes
async function marcarRecorrentesEmMassa() {
  const fb = window.firebaseDB;

  // Agrupar despesas por imóvel+tipo
  const grupos = {};
  for (const d of state.despesas) {
    const key = `${d.imovel}||${d.tipo}`;
    if (!grupos[key]) grupos[key] = [];
    grupos[key].push(d);
  }

  // Detectar despesas que se repetem em pelo menos 2 meses diferentes
  const candidatas = [];
  for (const [key, lista] of Object.entries(grupos)) {
    if (lista.length < 2) continue;
    // Verificar se há despesas em pelo menos 2 meses diferentes
    const mesesUnicos = new Set(lista.map(d => `${d.ano}-${d.mes}`));
    if (mesesUnicos.size < 2) continue;
    // Pega a mais recente como referência
    const maisRecente = lista.reduce((a, b) =>
      (b.ano > a.ano || (b.ano === a.ano && b.mes > a.mes)) ? b : a
    );
    // Só inclui se a mais recente NÃO está marcada como recorrente ainda
    if (!maisRecente.recorrente) {
      candidatas.push({ key, despesa: maisRecente, qtd: lista.length });
    }
  }

  if (candidatas.length === 0) {
    alert("✅ Tudo certo!\n\nNão encontrei despesas repetidas que precisam ser marcadas como recorrentes. Todas as despesas que se repetem já estão marcadas, ou só aparecem uma vez.");
    return;
  }

  // Mostrar lista pro usuário e pedir confirmação
  const lista = candidatas.map(c => `• ${c.despesa.tipo} - ${c.despesa.imovel} (aparece em ${c.qtd} meses)`).join('\n');
  const confirmar = confirm(`Detectei ${candidatas.length} despesa(s) que aparece(m) em vários meses mas não está(ão) marcada(s) como recorrente(s):\n\n${lista}\n\nPosso marcar todas como recorrentes?\n\nIsso permite usar "🔄 Gerar meses" pra criar essas despesas automaticamente nos próximos meses.`);

  if (!confirmar) return;

  // Marcar todas
  try {
    let marcadas = 0;
    for (const c of candidatas) {
      await fb.updateDoc(fb.doc(fb.db, "despesas", c.despesa.id), { recorrente: true });
      marcadas++;
    }
    await carregarDados();
    alert(`✅ ${marcadas} despesa(s) marcada(s) como recorrente(s)!\n\nAgora você pode usar o botão "🔄 Gerar meses" pra criar essas despesas nos próximos meses automaticamente.`);
  } catch (e) {
    alert("Erro ao marcar despesas: " + e.message);
  }
}
window.marcarRecorrentesEmMassa = marcarRecorrentesEmMassa;

async function gerarRecorrentes(mesInicio, anoInicio, mesFim, anoFim) {
  try {
    const fb = window.firebaseDB;
    // Pega todas as despesas marcadas como recorrentes (a "mãe" só uma vez por imóvel+tipo)
    const recorrentes = state.despesas.filter(d => d.recorrente);
    if (recorrentes.length === 0) {
      alert("Nenhuma despesa recorrente cadastrada.\n\nPra usar essa função, edite uma despesa e marque o checkbox '🔄 Despesa recorrente (todo mês)'.");
      return;
    }

    // Resumir por imóvel+tipo, pegando o lançamento MAIS RECENTE como base
    const baseUnica = {};
    for (const r of recorrentes) {
      const key = `${r.imovel}||${r.tipo}`;
      const existente = baseUnica[key];
      if (!existente || (r.ano > existente.ano) || (r.ano === existente.ano && r.mes > existente.mes)) {
        baseUnica[key] = r;
      }
    }
    const basesPraGerar = Object.values(baseUnica);

    // Iterar de mesInicio/anoInicio até mesFim/anoFim
    let criadas = 0, ignoradas = 0;
    const detalhes = []; // pra log

    let mesAtual = mesInicio, anoAtual = anoInicio;
    while ((anoAtual < anoFim) || (anoAtual === anoFim && mesAtual <= mesFim)) {
      for (const r of basesPraGerar) {
        // Pula se essa é a própria base (mesmo mes/ano) — não duplica
        if (r.mes === mesAtual && r.ano === anoAtual) continue;

        const jaExiste = state.despesas.some(d =>
          d.imovel === r.imovel && d.tipo === r.tipo &&
          d.mes === mesAtual && d.ano === anoAtual
        );
        if (jaExiste) { ignoradas++; continue; }

        const novaDespesa = {
          imovel: r.imovel, tipo: r.tipo,
          mes: mesAtual, ano: anoAtual,
          dia_venc: r.dia_venc,
          valor: r.valor,
          status: 'pendente',
          pago_por: r.pago_por || 'proprietario',
          recorrente: false,
          confirmar_valor: true,
        };
        await fb.addDoc(fb.collection(fb.db, "despesas"), novaDespesa);
        criadas++;
        detalhes.push(`${MESES[mesAtual-1]}/${anoAtual}: ${r.tipo} (${r.imovel})`);
      }
      // Avança 1 mês
      mesAtual++;
      if (mesAtual > 12) { mesAtual = 1; anoAtual++; }
    }

    await carregarDados();
    state.modalGerarRecorrentes = null;
    render();

    const resumoTipos = basesPraGerar.map(r => `• ${r.tipo} - ${r.imovel}`).join('\n');
    alert(`✅ Geração concluída!\n\n${criadas} despesa(s) criada(s)${ignoradas > 0 ? '\n' + ignoradas + ' já existiam (foram ignoradas)' : ''}\n\nDespesas recorrentes geradas:\n${resumoTipos}\n\n⚠️ Confira os valores nos próximos meses e ajuste se necessário (badge "Confirmar valor").`);
  } catch (e) { alert("Erro: " + e.message); console.error(e); }
}

async function salvarReceita(r) {
  try {

    const dados = { imovel: r.imovel, mes: Number(r.mes), ano: Number(r.ano), valor: Number(r.valor), categoria: r.categoria || Financeiro.categoriaReceita(r) };

      ehNova = true;
    }
    state.modalReceita = null;

}

// Total de documentos de um imóvel (soma de todas as categorias)
function totalDocsImovel(imovelId) {
  let total = 0;
  for (const cat of CATEGORIAS_DOC) {
    total += state.anexosCount[`doc_${imovelId}_${cat.id}`] || 0;
  }
  return total;
}

const STORAGE_PASTA = "millemiglia"; // pasta raiz no Storage

// Categorias de documentos por imóvel
const CATEGORIAS_DOC = [
  { id: 'matricula', nome: 'Matrícula', icone: '📄' },
  { id: 'iptu', nome: 'IPTU', icone: '🏛️' },
  { id: 'contrato', nome: 'Contrato de Aluguel', icone: '📝' },
  { id: 'escritura', nome: 'Escritura', icone: '🏠' },
  { id: 'outros', nome: 'Outros', icone: '📁' },
];

// Listar anexos de um item (despesa ou receita)
async function listarAnexos(tipo, id) {
  try {
    const st = window.firebaseStorage;
    const folderRef = st.ref(st.storage, `${STORAGE_PASTA}/${tipo}_${id}`);
    const result = await st.listAll(folderRef);
    const anexos = await Promise.all(
      result.items.map(async (itemRef) => {
        const url = await st.getDownloadURL(itemRef);
        return { nome: itemRef.name, url, fullPath: itemRef.fullPath };
      })
    );
    state.anexosCache[`${tipo}_${id}`] = anexos;
    state.anexosCount[`${tipo}_${id}`] = anexos.length;
    return anexos;
  } catch (e) {
    console.error("Erro ao listar anexos:", e);
    state.anexosCache[`${tipo}_${id}`] = [];
    state.anexosCount[`${tipo}_${id}`] = 0;
    return [];
  }
}

// Upload de arquivo
async function uploadAnexo(tipo, id, file) {
  if (file.size > 10 * 1024 * 1024) {
    alert("Arquivo muito grande! Limite de 10MB.");
    return false;
  }
  try {
    state.uploadProgresso = true;
    render();
    const st = window.firebaseStorage;
    // Nome único: timestamp + nome original (limpo)
    const nomeSeguro = file.name.replace(/[^a-zA-Z0-9.\-_]/g, "_");
    const nomeArquivo = `${Date.now()}_${nomeSeguro}`;
    const fileRef = st.ref(st.storage, `${STORAGE_PASTA}/${tipo}_${id}/${nomeArquivo}`);
    await st.uploadBytes(fileRef, file);
    await listarAnexos(tipo, id);
    state.uploadProgresso = false;
    render();
    return true;
  } catch (e) {
    state.uploadProgresso = false;
    alert("Erro ao enviar arquivo: " + e.message);
    render();
    return false;
  }
}

// Deletar anexo
async function deletarAnexo(tipo, id, fullPath) {
  if (!confirm("Apagar este anexo? Não dá pra recuperar depois.")) return;
  try {
    const st = window.firebaseStorage;
    const fileRef = st.ref(st.storage, fullPath);
    await st.deleteObject(fileRef);
    await listarAnexos(tipo, id);
    render();
  } catch (e) { alert("Erro ao apagar: " + e.message); }
}

// Carregar contagem de anexos pra todos os itens (rápido, só pra mostrar 📎 N)
async function carregarContagemAnexos() {
  try {
    const st = window.firebaseStorage;
    const rootRef = st.ref(st.storage, STORAGE_PASTA);
    const result = await st.listAll(rootRef);
    state.anexosCount = {};
    for (const prefix of result.prefixes) {
      const subResult = await st.listAll(prefix);
      const key = prefix.name; // tipo_id
      state.anexosCount[key] = subResult.items.length;
    }
    render();
  } catch (e) {
    console.error("Erro ao contar anexos:", e);
  }
}

// === COMPUTAÇÕES ===
function getDados() {
  const mesAtual = HOJE.getMonth() + 1;
  const anoAtual = HOJE.getFullYear();
  const hoje0 = new Date(HOJE.getFullYear(), HOJE.getMonth(), HOJE.getDate());

  // Mês anterior (pra comparativos)
  let mesAnt = mesAtual - 1, anoAnt = anoAtual;
  if (mesAnt === 0) { mesAnt = 12; anoAnt = anoAtual - 1; }

  const imoveisProprios = state.imoveis.filter(i => i.status === "proprio").map(i => i.nome);
  // Dinheiro de terceiros (aluguel de imóvel administrado e repasse ao proprietário) fica fora do caixa da empresa:
  // aparece só em Contas › Terceiros.
  const receitasAtivas = state.receitas.filter(r => !imoveisProprios.includes(r.imovel) && !Financeiro.ehTerceiros(r, false));
  const despesasAtivas = state.despesas.filter(d => !imoveisProprios.includes(d.imovel) && !Financeiro.ehTerceiros(d, true));
  const imoveisAtivos = state.imoveis.filter(i => i.status !== "proprio");

  // Repasse ao proprietário também é conta a pagar, então entra nos vencimentos (mas não nos totais da empresa).
  const proximosVencimentos = state.despesas.filter(d => !imoveisProprios.includes(d.imovel))
    .filter(d => d.status === "pendente")
    .map(d => {
      const data = new Date(d.ano, d.mes - 1, d.dia_venc);
      const diasRestantes = Math.ceil((data - hoje0) / (1000 * 60 * 60 * 24));
      return { ...d, dataVenc: data, diasRestantes };
    })
    .sort((a, b) => a.diasRestantes - b.diasRestantes);

  // Mês atual
  const totalReceitaMes = receitasAtivas.filter(r => r.mes === mesAtual && r.ano === anoAtual).reduce((s, r) => s + Number(r.valor), 0);
  const totalDespesaMes = despesasAtivas.filter(d => d.mes === mesAtual && d.ano === anoAtual).reduce((s, d) => s + Number(d.valor), 0);
  // Mês anterior (pra tendência)
  const totalReceitaMesAnt = receitasAtivas.filter(r => r.mes === mesAnt && r.ano === anoAnt).reduce((s, r) => s + Number(r.valor), 0);
  const totalDespesaMesAnt = despesasAtivas.filter(d => d.mes === mesAnt && d.ano === anoAnt).reduce((s, d) => s + Number(d.valor), 0);
  // Variações %
  const varReceita = totalReceitaMesAnt > 0 ? ((totalReceitaMes - totalReceitaMesAnt) / totalReceitaMesAnt * 100) : null;
  const varDespesa = totalDespesaMesAnt > 0 ? ((totalDespesaMes - totalDespesaMesAnt) / totalDespesaMesAnt * 100) : null;
  // Ano
  const totalReceitaAno = receitasAtivas.filter(r => r.ano === anoAtual).reduce((s, r) => s + Number(r.valor), 0);
  const totalDespesaAno = despesasAtivas.filter(d => d.ano === anoAtual).reduce((s, d) => s + Number(d.valor), 0);
  // Ano passado (pra comparativo ano a ano)
  const anoPassado = anoAtual - 1;
  const totalReceitaAnoPassado = receitasAtivas.filter(r => r.ano === anoPassado).reduce((s, r) => s + Number(r.valor), 0);
  const totalDespesaAnoPassado = despesasAtivas.filter(d => d.ano === anoPassado).reduce((s, d) => s + Number(d.valor), 0);

  // Projeção próximos 3 meses (despesas pendentes)
  const projecao3meses = [];
  for (let i = 0; i < 3; i++) {
    let pm = mesAtual + i, pa = anoAtual;
    while (pm > 12) { pm -= 12; pa++; }
    const desp = despesasAtivas.filter(d => d.mes === pm && d.ano === pa && d.status === 'pendente').reduce((s, d) => s + Number(d.valor), 0);
    projecao3meses.push({ mes: pm, ano: pa, total: desp });
  }

  const indicadores = {
    ativos: state.imoveis.filter(i => i.status === "ativo").length,
    totalReceitaMes, totalDespesaMes, resultadoMes: totalReceitaMes - totalDespesaMes,
    totalReceitaAno, totalDespesaAno,
    totalReceitaAnoPassado, totalDespesaAnoPassado,
    varReceita, varDespesa,
    venc7dias: proximosVencimentos.filter(v => v.diasRestantes >= 0 && v.diasRestantes <= 7).length,
    vencidos: proximosVencimentos.filter(v => v.diasRestantes < 0).length,
  };

  // Resumo por imóvel (mês + ano + total + margem operacional)
  const resumoImoveis = imoveisAtivos.map(im => {
    const recMes = receitasAtivas.filter(r => r.imovel === im.nome && r.mes === mesAtual && r.ano === anoAtual).reduce((s, r) => s + Number(r.valor), 0);
    const despMes = despesasAtivas.filter(d => d.imovel === im.nome && d.mes === mesAtual && d.ano === anoAtual).reduce((s, d) => s + Number(d.valor), 0);
    const recAno = receitasAtivas.filter(r => r.imovel === im.nome && r.ano === anoAtual).reduce((s, r) => s + Number(r.valor), 0);
    const despAno = despesasAtivas.filter(d => d.imovel === im.nome && d.ano === anoAtual).reduce((s, d) => s + Number(d.valor), 0);
    const recTot = receitasAtivas.filter(r => r.imovel === im.nome).reduce((s, r) => s + Number(r.valor), 0);
    const despTot = despesasAtivas.filter(d => d.imovel === im.nome).reduce((s, d) => s + Number(d.valor), 0);
    // Margem operacional: (receita - despesa) / receita
    const margemAno = recAno > 0 ? ((recAno - despAno) / recAno * 100) : null;
    const margemMes = recMes > 0 ? ((recMes - despMes) / recMes * 100) : null;
    return {
      nome: im.nome, status: im.status, inquilino: im.inquilino, dia_vencimento: im.dia_vencimento,
      aluguel: im.aluguel, endereco: im.endereco, id: im.id,
      receitaMes: recMes, despesaMes: despMes, resultadoMes: recMes - despMes,
      receitaAno: recAno, despesaAno: despAno, resultadoAno: recAno - despAno,
      receitaTotal: recTot, despesaTotal: despTot, resultadoTotal: recTot - despTot,
      margemMes, margemAno,
    };
  });

  const evolucaoMensal = MESES.map((mes, idx) => {
    const m = idx + 1;
    const rec = receitasAtivas.filter(r => r.mes === m && r.ano === anoAtual).reduce((s, r) => s + Number(r.valor), 0);
    const desp = despesasAtivas.filter(d => d.mes === m && d.ano === anoAtual).reduce((s, d) => s + Number(d.valor), 0);
    return { mes, receitas: Math.round(rec), despesas: Math.round(desp), resultado: Math.round(rec - desp) };
  });

  // Alertas inteligentes: imóvel ativo (alugado) sem aluguel cadastrado este mês
  const alertasInteligentes = [];
  imoveisAtivos.forEach(im => {
    // imóvel com contrato de locação é acompanhado em Contas › A receber
    const temContrato = state.contratos.some(c => c.imovel === im.nome && Financeiro.locacaoNoMes(c, { mes: mesAtual, ano: anoAtual }));
    if (im.status === 'ativo' && im.inquilino && !temContrato) {
      const temAluguel = receitasAtivas.find(r => r.imovel === im.nome && r.mes === mesAtual && r.ano === anoAtual);
      if (!temAluguel) {
        alertasInteligentes.push({ tipo: 'aluguel_faltando', imovel: im.nome, msg: `Aluguel de ${im.nome} (inquilino ${im.inquilino}) não foi cadastrado este mês` });
      }
    }
  });

  return {
    mesAtual, anoAtual, mesAnt, anoAnt, anoPassado,
    imoveisAtivos, receitasAtivas, despesasAtivas, proximosVencimentos,
    indicadores, resumoImoveis, evolucaoMensal,
    alertasInteligentes, projecao3meses,
  };
}

// === RENDERIZAÇÃO ===
function escapeHtml(s) {
  if (s == null) return '';
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function render() {
  const root = document.getElementById('app');

  if (state.carregando) {
    root.innerHTML = `<div class="min-h-screen flex items-center justify-center"><div class="text-center"><div class="accent">${icons.loader}</div><p class="titulo-serif text-2xl mt-4" style="color:#1a3a2a">Carregando dados...</p></div></div>`;
    return;
  }

  if (state.erro) {
    root.innerHTML = `<div class="min-h-screen flex items-center justify-center p-6"><div class="card rounded-xl p-8 max-w-md"><div class="text-red-700 mb-4">${icons.alert}</div><h2 class="titulo-serif text-2xl font-bold mb-2" style="color:#1a3a2a">Erro de conexão</h2><p class="text-sm text-stone-600 mb-4">${escapeHtml(traduzErroDados(state.erro))}</p>${window.usuario ? `<p class="text-xs text-stone-500 mb-4">Entrou como ${escapeHtml(window.usuario.email || '')}</p>` : ''}<div class="flex gap-2"><button onclick="carregarDados()" class="accent-bg text-amber-50 px-4 py-2 rounded-md text-sm font-semibold">Tentar novamente</button><button onclick="sair()" class="px-4 py-2 rounded-md text-sm border border-stone-300 text-stone-700">Sair e entrar de novo</button></div></div></div>`;
    return;
  }

  const d = getDados();
  let html = renderHeader();

  if (state.aba === 'dashboard') html += renderDashboard(d);
  else if (state.aba === 'imoveis') html += renderImoveis(d);
  else if (state.aba === 'lancamentos') {
    html += renderSubAbas();
    if (state.subAba === 'receitas') html += renderReceitas(d);
    else if (state.subAba === 'despesas') html += renderDespesas(d);
    else if (state.subAba === 'receber') html += renderReceber(d);
    else if (state.subAba === 'terceiros') html += renderTerceiros(d);
    else html += renderVencimentos(d);
  }
  else if (state.aba === 'contratos') html += renderContratos(d);
  else if (state.aba === 'relatorios') html += renderRelatorios(d);

  if (state.modalImovel) html += renderModalImovel();
  if (state.modalDespesa) html += renderModalDespesa(d);
  if (state.modalReceita) html += renderModalReceita(d);
  if (state.modalDetalheImovel) html += renderModalDetalheImovel(d);
  if (state.modalAnexos) html += renderModalAnexos();
  if (state.modalDocumentos) html += renderModalDocumentos();
  if (state.modalGerarRecorrentes) html += renderModalGerarRecorrentes();
  if (state.modalExtrato) html += renderModalExtrato();
  if (state.modalPessoa) html += renderModalPessoa();
  if (state.modalContrato) html += renderModalContrato();
  if (state.modalBaixa) html += renderModalBaixa();

  root.innerHTML = html;
}

// Linha do Início com contas a receber, atrasos e conta de terceiros (só aparece quando há contratos).
function renderResumoFinanceiro(d) {
  if (!state.contratos.length) return '';
  const k = Financeiro.chaveMes(d.anoAtual, d.mesAtual);
  const aReceber = state.parcelas.filter(p => p.status === 'pendente' && Financeiro.chaveMes(p.ano, p.mes) === k);
  const inad = Financeiro.inadimplencia(state.parcelas, hojeISO());
  const ter = Financeiro.contaTerceiros(state.receitas, state.despesas);
  const com = Financeiro.comissoes(state.despesas, state.pessoas).reduce((s, c) => s + c.aPagar, 0);
  const item = (rot, v, sub, cor, acao) => `<button onclick="${acao}" class="card rounded-xl p-5 hover-lift text-left"><div class="text-xs uppercase tracking-widest text-stone-500 font-semibold mb-2">${rot}</div><div class="titulo-serif text-2xl font-bold num-mono" style="color:${cor}">${formatBRL(v)}</div><div class="text-xs text-stone-500 mt-1">${sub}</div></button>`;
  return `<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-5">
    ${item(`A receber · ${MESES[d.mesAtual - 1]}`, aReceber.reduce((s, p) => s + p.valor, 0), `${aReceber.length} parcela(s) dos contratos`, '#1a4d3a', "setAba('lancamentos');setSubAba('receber')")}
    ${item('Em atraso', inad.total, `${inad.lista.length} parcela(s) vencida(s)`, inad.total ? '#c62828' : '#1a4d3a', "setAba('relatorios');setSubRel('inadimplencia')")}
    ${item('Conta de terceiros', ter.saldo, `${formatBRL(ter.aRepassar)} a repassar`, '#1e3a5f', "setAba('lancamentos');setSubAba('terceiros')")}
    ${item('Comissões a pagar', com, 'corretores', com ? '#8b3a3a' : '#1a4d3a', "setAba('relatorios');setSubRel('comissoes')")}
  </div>`;
}

function renderLineChart(data) {
  const w = 600, h = 240, padL = 50, padR = 20, padT = 20, padB = 30;
  const chartW = w - padL - padR, chartH = h - padT - padB;
  const allVals = data.flatMap(d => [d.receitas, d.despesas, d.resultado]);
  const maxV = Math.max(...allVals, 100);
  const minV = Math.min(...allVals, 0);
  const range = maxV - minV || 1;
  const xStep = chartW / (data.length - 1 || 1);

  const yScale = v => padT + chartH - ((v - minV) / range) * chartH;
  const xScale = i => padL + i * xStep;

  const linePath = (key, color) => {
    const pts = data.map((d, i) => `${xScale(i)},${yScale(d[key])}`).join(' L');
    return `<path d="M${pts}" stroke="${color}" stroke-width="2.5" fill="none"/>` +
           data.map((d, i) => `<circle cx="${xScale(i)}" cy="${yScale(d[key])}" r="3.5" fill="${color}"/>`).join('');
  };

  const yTicks = 4;
  const gridLines = Array.from({length: yTicks + 1}, (_, i) => {
    const v = minV + (range * i / yTicks);
    const y = yScale(v);
    return `<line x1="${padL}" y1="${y}" x2="${w-padR}" y2="${y}" stroke="#e8dfc9" stroke-dasharray="3,3"/><text x="${padL-8}" y="${y+4}" text-anchor="end" font-size="10" fill="#5d4037">${(v/1000).toFixed(0)}k</text>`;
  }).join('');

  return `<svg viewBox="0 0 ${w} ${h+40}" style="width:100%;height:auto" preserveAspectRatio="xMidYMid meet">
    ${gridLines}
    ${data.map((d, i) => `<text x="${xScale(i)}" y="${h-padB+15}" text-anchor="middle" font-size="10" fill="#5d4037">${d.mes}</text>`).join('')}
    ${linePath('receitas', '#1a4d3a')}
    ${linePath('despesas', '#8b3a3a')}
    ${linePath('resultado', '#c19a4a')}
    <g transform="translate(${padL}, ${h+15})">
      <circle cx="6" cy="6" r="5" fill="#1a4d3a"/><text x="16" y="10" font-size="11" fill="#5d4037">Receitas</text>
      <circle cx="90" cy="6" r="5" fill="#8b3a3a"/><text x="100" y="10" font-size="11" fill="#5d4037">Despesas</text>
      <circle cx="180" cy="6" r="5" fill="#c19a4a"/><text x="190" y="10" font-size="11" fill="#5d4037">Resultado</text>
    </g>
  </svg>`;
}

// Helper: gera título legível do card de total baseado nos filtros aplicados
function rotuloFiltro(d) {
  const mesAtual = HOJE.getMonth() + 1;
  const anoAtual = HOJE.getFullYear();
  const partes = [];

  // Imóvel
  if (state.filtroImovelLanc !== 'todos') {
    partes.push(state.filtroImovelLanc);
  }

  // Período rápido
  if (state.filtroPeriodoRapido === 'mes') {
    partes.push(`${MESES[mesAtual-1]}/${anoAtual}`);
  } else if (state.filtroPeriodoRapido === 'ano') {
    partes.push(anoAtual);
  } else if (state.filtroPeriodoRapido === 'hoje') {
    partes.push('Hoje');
  }

  // Mês/ano específico
  if (state.filtroMesLanc !== 'todos' && state.filtroAnoLanc !== 'todos') {
    partes.push(`${MESES[Number(state.filtroMesLanc)-1]}/${state.filtroAnoLanc}`);
  } else if (state.filtroMesLanc !== 'todos') {
    partes.push(`${MESES[Number(state.filtroMesLanc)-1]} (todos os anos)`);
  } else if (state.filtroAnoLanc !== 'todos') {
    partes.push(`Ano ${state.filtroAnoLanc}`);
  }

  // Período de/até
  if (state.filtroDataInicio || state.filtroDataFim) {
    const ini = state.filtroDataInicio ? state.filtroDataInicio.replace('-', '/') : '...';
    const fim = state.filtroDataFim ? state.filtroDataFim.replace('-', '/') : '...';
    partes.push(`${ini} → ${fim}`);
  }

  if (partes.length === 0) return `${MESES[mesAtual-1]}/${anoAtual}`;
  return partes.join(' · ');
}

// Helper: detecta se há algum filtro ativo (diferente do padrão)
function temFiltroAtivo() {
  return state.filtroImovelLanc !== 'todos'
    || state.filtroMesLanc !== 'todos'
    || state.filtroAnoLanc !== 'todos'
    || state.filtroPeriodoRapido !== 'tudo'
    || state.filtroDataInicio
    || state.filtroDataFim;
}

function aplicarFiltrosLanc(lista) {
  const mesAtual = HOJE.getMonth() + 1;
  const anoAtual = HOJE.getFullYear();
  let r = [...lista];

  if (state.filtroImovelLanc !== 'todos') r = r.filter(x => x.imovel === state.filtroImovelLanc);

  // Período rápido
  if (state.filtroPeriodoRapido === 'mes') {
    r = r.filter(x => x.mes === mesAtual && x.ano === anoAtual);
  } else if (state.filtroPeriodoRapido === 'ano') {
    r = r.filter(x => x.ano === anoAtual);
  } else if (state.filtroPeriodoRapido === 'hoje') {
    // só lançamentos de hoje (despesas têm dia_venc, receitas não)
    r = r.filter(x => x.mes === mesAtual && x.ano === anoAtual && (x.dia_venc === HOJE.getDate() || !x.dia_venc));
  }

  // Mês/ano específicos
  if (state.filtroMesLanc !== 'todos') r = r.filter(x => x.mes === Number(state.filtroMesLanc));
  if (state.filtroAnoLanc !== 'todos') r = r.filter(x => x.ano === Number(state.filtroAnoLanc));

  // Período de/até
  if (state.filtroDataInicio) {
    const [aIni, mIni] = state.filtroDataInicio.split('-').map(Number);
    r = r.filter(x => (x.ano > aIni) || (x.ano === aIni && x.mes >= mIni));
  }
  if (state.filtroDataFim) {
    const [aFim, mFim] = state.filtroDataFim.split('-').map(Number);
    r = r.filter(x => (x.ano < aFim) || (x.ano === aFim && x.mes <= mFim));
  }

  return r;
}

function renderBarChart(data) {
  const w = 700, h = 320, padL = 50, padR = 20, padT = 20, padB = 80;
  const chartW = w - padL - padR, chartH = h - padT - padB;
  const allVals = data.flatMap(d => [d.receitaMes, d.despesaMes, d.resultadoMes]);
  const maxV = Math.max(...allVals, 100);
  const minV = Math.min(...allVals, 0);
  const range = maxV - minV || 1;
  const groupW = chartW / (data.length || 1);
  const barW = groupW / 4;

  const yScale = v => padT + chartH - ((v - minV) / range) * chartH;
  const y0 = yScale(0);

  const yTicks = 4;
  const grid = Array.from({length: yTicks + 1}, (_, i) => {
    const v = minV + (range * i / yTicks);
    const y = yScale(v);
    return `<line x1="${padL}" y1="${y}" x2="${w-padR}" y2="${y}" stroke="#e8dfc9" stroke-dasharray="3,3"/><text x="${padL-8}" y="${y+4}" text-anchor="end" font-size="10" fill="#5d4037">${(v/1000).toFixed(0)}k</text>`;
  }).join('');

  const bars = data.map((d, i) => {
    const x0 = padL + i * groupW + groupW/2 - barW*1.5;
    const renderBar = (val, offsetMul, color) => {
      const y = yScale(Math.max(val, 0));
      const height = Math.abs(yScale(val) - y0);
      return `<rect x="${x0 + offsetMul*barW}" y="${val >= 0 ? y : y0}" width="${barW-2}" height="${height}" fill="${color}" rx="3"/>`;
    };
    const label = d.nome.length > 14 ? d.nome.substring(0, 14) + '…' : d.nome;
    return renderBar(d.receitaMes, 0, '#1a4d3a') + renderBar(d.despesaMes, 1, '#8b3a3a') + renderBar(d.resultadoMes, 2, '#c19a4a') +
      `<text x="${padL + i*groupW + groupW/2}" y="${h-padB+15}" text-anchor="middle" font-size="9" fill="#5d4037" transform="rotate(-15 ${padL + i*groupW + groupW/2} ${h-padB+15})">${escapeHtml(label)}</text>`;
  }).join('');

  return `<svg viewBox="0 0 ${w} ${h+30}" style="width:100%;height:auto" preserveAspectRatio="xMidYMid meet">
    ${grid}
    <line x1="${padL}" y1="${y0}" x2="${w-padR}" y2="${y0}" stroke="#5d4037" stroke-width="1"/>
    ${bars}
    <g transform="translate(${padL}, ${h+10})">
      <rect x="0" y="0" width="12" height="12" fill="#1a4d3a" rx="2"/><text x="18" y="10" font-size="11" fill="#5d4037">Receita</text>
      <rect x="80" y="0" width="12" height="12" fill="#8b3a3a" rx="2"/><text x="98" y="10" font-size="11" fill="#5d4037">Despesa</text>
      <rect x="170" y="0" width="12" height="12" fill="#c19a4a" rx="2"/><text x="188" y="10" font-size="11" fill="#5d4037">Resultado</text>
    </g>
  </svg>`;
}

function renderComparativo(d) {
  const ind = d.indicadores;
  const anoAtual = d.anoAtual;
  const anoPassado = d.anoPassado;

  // Por mês: receita/despesa do ano atual vs ano passado
  const meses = MESES.map((mes, idx) => {
    const m = idx + 1;
    const recAtual = d.receitasAtivas.filter(r => r.mes === m && r.ano === anoAtual).reduce((s, r) => s + Number(r.valor), 0);
    const despAtual = d.despesasAtivas.filter(x => x.mes === m && x.ano === anoAtual).reduce((s, x) => s + Number(x.valor), 0);
    const recPas = d.receitasAtivas.filter(r => r.mes === m && r.ano === anoPassado).reduce((s, r) => s + Number(r.valor), 0);
    const despPas = d.despesasAtivas.filter(x => x.mes === m && x.ano === anoPassado).reduce((s, x) => s + Number(x.valor), 0);
    return { mes, recAtual, despAtual, recPas, despPas, resultAtual: recAtual - despAtual, resultPas: recPas - despPas };
  });

  const variacaoReceita = ind.totalReceitaAnoPassado > 0 ? ((ind.totalReceitaAno - ind.totalReceitaAnoPassado) / ind.totalReceitaAnoPassado * 100) : null;
  const variacaoDespesa = ind.totalDespesaAnoPassado > 0 ? ((ind.totalDespesaAno - ind.totalDespesaAnoPassado) / ind.totalDespesaAnoPassado * 100) : null;
  const resultadoAtual = ind.totalReceitaAno - ind.totalDespesaAno;
  const resultadoPassado = ind.totalReceitaAnoPassado - ind.totalDespesaAnoPassado;

  return `<main class="max-w-7xl mx-auto px-6 py-8">

          ${variacaoReceita !== null ? `<div class="text-sm font-semibold mt-2" style="color:${variacaoReceita >= 0 ? '#16a34a' : '#c62828'}">${variacaoReceita >= 0 ? '▲' : '▼'} ${Math.abs(variacaoReceita).toFixed(1)}%</div>` : '<div class="text-xs text-stone-400 mt-2">sem dados de comparação</div>'}

          <div class="text-xs text-stone-500 mt-1">vs ${formatBRL(ind.totalDespesaAnoPassado)} em ${anoPassado}</div>
          ${variacaoDespesa !== null ? `<div class="text-sm font-semibold mt-2" style="color:${variacaoDespesa >= 0 ? '#c62828' : '#16a34a'}">${variacaoDespesa >= 0 ? '▲' : '▼'} ${Math.abs(variacaoDespesa).toFixed(1)}%</div>` : '<div class="text-xs text-stone-400 mt-2">sem dados de comparação</div>'}
        </div>
        <div class="card rounded-xl p-6" style="background:${resultadoAtual >= 0 ? 'linear-gradient(135deg,#1a4d3a,#2e6b52)' : 'linear-gradient(135deg,#8b3a3a,#a64453)'};color:#fdfbf6">

        <table class="w-full text-sm">
          <thead style="background:#1a4d3a">
            <tr>
              <th class="text-left px-4 py-3 text-xs uppercase tracking-wider font-semibold text-amber-50">Mês</th>
              <th class="text-right px-4 py-3 text-xs uppercase tracking-wider font-semibold text-amber-50">Receita ${anoPassado}</th>
              <th class="text-right px-4 py-3 text-xs uppercase tracking-wider font-semibold text-amber-50">Receita ${anoAtual}</th>

            </tr>

          <tbody>

              <td class="px-4 py-3 text-right num-mono ${m.recPas > 0 ? 'text-stone-700' : 'text-stone-300'}">${m.recPas > 0 ? formatBRL(m.recPas) : '—'}</td>
              <td class="px-4 py-3 text-right num-mono ${m.recAtual > 0 ? 'accent font-semibold' : 'text-stone-300'}">${m.recAtual > 0 ? formatBRL(m.recAtual) : '—'}</td>
              <td class="px-4 py-3 text-right num-mono ${m.despPas > 0 ? 'text-stone-700' : 'text-stone-300'}">${m.despPas > 0 ? formatBRL(m.despPas) : '—'}</td>
              <td class="px-4 py-3 text-right num-mono ${m.despAtual > 0 ? '' : 'text-stone-300'}" style="${m.despAtual > 0 ? 'color:#8b3a3a' : ''}">${m.despAtual > 0 ? formatBRL(m.despAtual) : '—'}</td>
              <td class="px-4 py-3 text-right num-mono ${m.resultPas !== 0 ? 'font-semibold' : 'text-stone-300'}" style="${m.resultPas !== 0 ? `color:${m.resultPas >= 0 ? '#1a4d3a' : '#8b3a3a'}` : ''}">${m.resultPas !== 0 ? formatBRL(m.resultPas) : '—'}</td>
              <td class="px-4 py-3 text-right num-mono ${m.resultAtual !== 0 ? 'font-bold' : 'text-stone-300'}" style="${m.resultAtual !== 0 ? `color:${m.resultAtual >= 0 ? '#1a4d3a' : '#8b3a3a'}` : ''}">${m.resultAtual !== 0 ? formatBRL(m.resultAtual) : '—'}</td>

                <th class="text-right px-4 py-3 text-xs uppercase tracking-wider font-semibold text-amber-50">Receita</th>

function renderModalGerarRecorrentes() {
  const m = state.modalGerarRecorrentes;
  const mesAtual = HOJE.getMonth() + 1;
  const anoAtual = HOJE.getFullYear();

  // Achar despesas recorrentes únicas (por imóvel+tipo, mantendo a mais recente)
  const recorrentes = state.despesas.filter(d => d.recorrente);
  const baseUnica = {};
  for (const r of recorrentes) {
    const key = `${r.imovel}||${r.tipo}`;
    const existente = baseUnica[key];
    if (!existente || (r.ano > existente.ano) || (r.ano === existente.ano && r.mes > existente.mes)) {
      baseUnica[key] = r;
    }
  }
  const basesPraGerar = Object.values(baseUnica);

  // Mes/ano alvo (default: dezembro do ano atual)
  const mesAlvo = m.mesAlvo || 12;
  const anoAlvo = m.anoAlvo || anoAtual;

  // Calcular quantos meses serão gerados
  let totalMeses = 0;
  let mAtual = mesAtual, aAtual = anoAtual;
  while ((aAtual < anoAlvo) || (aAtual === anoAlvo && mAtual <= mesAlvo)) {
    totalMeses++;
    mAtual++;
    if (mAtual > 12) { mAtual = 1; aAtual++; }
  }
  const totalEstimado = totalMeses * basesPraGerar.length;

  return `<div class="fixed inset-0 modal-overlay z-50 flex items-center justify-center p-4" onclick="if(event.target===this)fecharModalGerarRecorrentes()">
    <div class="card rounded-xl max-w-xl w-full max-h-[90vh] overflow-y-auto" style="background:#fdfbf6">
      <div class="flex justify-between items-start p-6 border-b" style="border-color:#e8dfc9">
        <div>
          <h3 class="titulo-serif text-2xl font-bold" style="color:#1a3a2a">🔄 Gerar Despesas Recorrentes</h3>
          <p class="text-sm text-stone-500 mt-1">Cria automaticamente as despesas que se repetem todo mês</p>
        </div>
        <button onclick="fecharModalGerarRecorrentes()">${icons.x}</button>
      </div>

      <div class="p-6 space-y-5">
        ${basesPraGerar.length === 0 ? `
          <div class="rounded-lg p-5 text-center" style="background:#fef3c7;border:1px solid #fcd34d">
            <div class="text-3xl mb-2">⚠️</div>
            <p class="text-sm font-semibold" style="color:#92400e">Nenhuma despesa marcada como recorrente</p>
            <p class="text-xs text-stone-600 mt-2">Pra usar essa função, primeiro edite uma despesa (Condomínio, IPTU, Carnê Leão...) e marque o checkbox <strong>"🔄 Despesa recorrente (todo mês)"</strong>.</p>
          </div>
        ` : `
          <div>
            <div class="text-xs uppercase tracking-wider font-semibold mb-2" style="color:#5d4037">Despesas que vão ser geradas (${basesPraGerar.length})</div>
            <div class="rounded-lg p-3 space-y-1.5" style="background:#f5f1e8;border:1px solid #e8dfc9;max-height:200px;overflow-y:auto">
              ${basesPraGerar.map(r => `<div class="flex items-center justify-between text-sm">
                <span class="font-semibold" style="color:#1a3a2a">${escapeHtml(r.tipo)}</span>
                <span class="text-stone-600 text-xs">${escapeHtml(r.imovel)} · dia ${r.dia_venc} · ${formatBRL(r.valor)}</span>
              </div>`).join('')}
            </div>
            <p class="text-xs text-stone-500 mt-2">💡 O valor vai ser herdado do último lançamento de cada despesa. Você confirma/ajusta depois.</p>
          </div>

          <div>
            <div class="text-xs uppercase tracking-wider font-semibold mb-2" style="color:#5d4037">Gerar de ${MESES[mesAtual-1]}/${anoAtual} até:</div>
            <div class="grid grid-cols-2 gap-3">
              <div>
                <label class="block text-xs text-stone-600 mb-1">Mês final</label>
                <select id="gr-mes" class="input" onchange="atualizarPreviewGerar()">
                  ${MESES.map((m, i) => `<option value="${i+1}" ${(i+1) === mesAlvo ? 'selected' : ''}>${m}</option>`).join('')}
                </select>
              </div>
              <div>
                <label class="block text-xs text-stone-600 mb-1">Ano final</label>
                <select id="gr-ano" class="input" onchange="atualizarPreviewGerar()">
                  ${[anoAtual, anoAtual + 1, anoAtual + 2].map(a => `<option value="${a}" ${a === anoAlvo ? 'selected' : ''}>${a}</option>`).join('')}
                </select>
              </div>
            </div>
          </div>

          <div class="rounded-lg p-4" style="background:linear-gradient(135deg,#1a4d3a,#2e6b52);color:#fdfbf6">
            <div class="text-xs uppercase tracking-widest opacity-80 font-semibold mb-1">Preview</div>
            <div class="num-mono text-lg font-bold">${totalMeses} mes(es) × ${basesPraGerar.length} despesa(s) = até ${totalEstimado} lançamento(s)</div>
            <div class="text-xs opacity-80 mt-1">Despesas que já existem serão ignoradas. Só cria novas.</div>
          </div>
        `}
      </div>

      <div class="flex justify-end gap-3 p-6 border-t" style="border-color:#e8dfc9">
        <button onclick="fecharModalGerarRecorrentes()" class="px-5 py-2 rounded-md text-sm font-semibold text-stone-700 hover:bg-stone-100">Cancelar</button>
        ${basesPraGerar.length > 0 ? `<button onclick="confirmarGerarRecorrentes()" class="px-5 py-2 rounded-md text-sm font-semibold text-amber-50" style="background:#1a4d3a">🔄 Gerar Despesas</button>` : ''}
      </div>
    </div>
  </div>`;
}

function renderModalDocumentos() {

function renderModalAnexos() {
  const m = state.modalAnexos;
  const key = `${m.tipo}_${m.id}`;
  const anexos = state.anexosCache[key] || [];
  const carregando = !state.anexosCache.hasOwnProperty(key);

  // Helper: ícone por tipo de arquivo
  const iconArquivo = (nome) => {
    const ext = nome.split('.').pop().toLowerCase();
    if (['pdf'].includes(ext)) return '📄';
    if (['jpg','jpeg','png','heic','webp','gif'].includes(ext)) return '🖼️';
    if (['doc','docx'].includes(ext)) return '📝';
    if (['xls','xlsx','csv'].includes(ext)) return '📊';
    return '📎';
  };

  // Nome amigável: tira o timestamp do começo
  const nomeAmigavel = (nome) => {
    const m2 = nome.match(/^\d+_(.+)$/);
    return m2 ? m2[1].replace(/_/g, ' ') : nome;
  };

  return `<div class="fixed inset-0 modal-overlay z-50 flex items-center justify-center p-4" onclick="if(event.target===this)fecharModalAnexos()">
    <div class="card rounded-xl max-w-2xl w-full max-h-[90vh] overflow-y-auto" style="background:#fdfbf6">
      <div class="flex justify-between items-start p-6 border-b" style="border-color:#e8dfc9">
        <div>
          <h3 class="titulo-serif text-2xl font-bold" style="color:#1a3a2a">📎 Anexos</h3>
          <p class="text-sm text-stone-500 mt-1">${escapeHtml(m.nome)}</p>
        </div>
        <button onclick="fecharModalAnexos()">${icons.x}</button>
      </div>
      <div class="p-6 space-y-4">
        ${carregando ? `<div class="text-center py-8"><div class="accent">${icons.loader}</div><p class="text-sm text-stone-500 mt-2">Carregando anexos...</p></div>` : ''}

        ${!carregando && anexos.length > 0 ? `
          <div class="space-y-2">
            ${anexos.map(a => `<div class="flex items-center gap-3 p-3 rounded-lg" style="background:#f5f1e8;border:1px solid #e8dfc9">
              <div class="text-2xl">${iconArquivo(a.nome)}</div>
              <div class="flex-1 min-w-0">
                <div class="text-sm font-semibold truncate" style="color:#1a3a2a">${escapeHtml(nomeAmigavel(a.nome))}</div>
              </div>
              <a href="${escapeHtml(a.url)}" target="_blank" rel="noopener" class="px-3 py-1.5 rounded text-xs font-semibold accent-bg text-amber-50 hover:opacity-80">Abrir</a>
              <a href="${escapeHtml(a.url)}" download="${escapeHtml(nomeAmigavel(a.nome))}" class="px-3 py-1.5 rounded text-xs font-semibold" style="background:#f5f1e8;color:#1a3a2a;border:1px solid #d4c5a0">Baixar</a>
              <button onclick="deletarAnexoUI('${m.tipo}','${m.id}','${escapeHtml(a.fullPath)}')" class="p-1.5 rounded hover:bg-red-100 text-red-700" title="Apagar">${icons.trash}</button>
            </div>`).join('')}
          </div>
        ` : ''}

        ${!carregando && anexos.length === 0 ? `
          <div class="text-center py-8 text-stone-400">
            <div class="text-5xl mb-2">📎</div>
            <p class="text-sm">Nenhum anexo ainda. Adicione boletos, comprovantes, notas fiscais...</p>
          </div>
        ` : ''}

        <div class="rounded-lg p-6 text-center" style="background:#f5f1e8;border:2px dashed #d4c5a0">
          ${state.uploadProgresso ? `
            <div class="accent">${icons.loader}</div>
            <p class="text-sm text-stone-700 mt-2">Enviando arquivo...</p>
          ` : `
            <div class="text-3xl mb-2">📤</div>
            <p class="text-sm text-stone-700 mb-3">Clique abaixo ou arraste um arquivo aqui</p>
            <input type="file" id="anexo-input" class="hidden" onchange="onAnexoSelecionado(event,'${m.tipo}','${m.id}')"/>
            <button onclick="document.getElementById('anexo-input').click()" class="accent-bg px-4 py-2 rounded-md text-sm font-semibold text-amber-50 hover:opacity-80">+ Escolher arquivo</button>
            <p class="text-xs text-stone-500 mt-2">PDF, foto, qualquer arquivo até 10MB</p>
          `}
        </div>
      </div>
      <div class="flex justify-end gap-3 p-6 border-t" style="border-color:#e8dfc9">
        <button onclick="fecharModalAnexos()" class="px-5 py-2 rounded-md text-sm font-semibold accent-bg text-amber-50">Fechar</button>
      </div>
    </div>
  </div>`;
}

function renderModalDetalheImovel(d) {
  const nome = state.modalDetalheImovel;
  const im = d.resumoImoveis.find(r => r.nome === nome);
  if (!im) { state.modalDetalheImovel = null; return ''; }
  const imOriginal = state.imoveis.find(i => i.nome === nome);

  // Filtrar lançamentos
  const recsIm = d.receitasAtivas.filter(r => r.imovel === nome);
  const despsIm = d.despesasAtivas.filter(x => x.imovel === nome);

  // Histórico mensal
  const porMes = {};
  recsIm.forEach(r => {
    const k = `${r.ano}-${String(r.mes).padStart(2,'0')}`;
    if (!porMes[k]) porMes[k] = { ano: r.ano, mes: r.mes, receita: 0, despesa: 0 };
    porMes[k].receita += Number(r.valor);
  });
  despsIm.forEach(x => {
    const k = `${x.ano}-${String(x.mes).padStart(2,'0')}`;
    if (!porMes[k]) porMes[k] = { ano: x.ano, mes: x.mes, receita: 0, despesa: 0 };
    porMes[k].despesa += Number(x.valor);
  });
  const mesesOrd = Object.values(porMes).sort((a, b) => (b.ano - a.ano) || (b.mes - a.mes));

  // Por tipo de despesa
  const porTipo = {};
  despsIm.forEach(x => {
    porTipo[x.tipo] = (porTipo[x.tipo] || 0) + Number(x.valor);
  });
  const tiposOrd = Object.entries(porTipo).sort((a, b) => b[1] - a[1]);

  // Últimas despesas
  const ultDesp = [...despsIm].sort((a, b) => (b.ano - a.ano) || (b.mes - a.mes) || (b.dia_venc - a.dia_venc)).slice(0, 15);

  return `<div class="fixed inset-0 modal-overlay z-50 flex items-start justify-center p-4 overflow-y-auto" onclick="if(event.target===this)fecharDetalheImovel()">
    <div class="card rounded-xl max-w-5xl w-full my-8" style="background:#fdfbf6">
      <div class="flex justify-between items-start p-6 border-b sticky top-0 z-10" style="border-color:#e8dfc9;background:#fdfbf6">
        <div>
          <div class="flex items-center gap-3 mb-1 flex-wrap">
            <h3 class="titulo-serif text-3xl font-bold" style="color:#1a3a2a">${escapeHtml(im.nome)}</h3>
            <span class="pill" style="background:${im.status === 'ativo' ? '#d1fae5' : im.status === 'vago' ? '#fee2e2' : '#fef3c7'};color:${im.status === 'ativo' ? '#065f46' : im.status === 'vago' ? '#991b1b' : '#854d0e'}">${escapeHtml(im.status)}</span>
          </div>
          ${im.endereco ? `<p class="text-sm text-stone-500">${escapeHtml(im.endereco)}</p>` : ''}
          ${im.inquilino ? `<p class="text-xs text-stone-500 mt-1">👤 Inquilino: ${escapeHtml(im.inquilino)}</p>` : ''}
          ${im.aluguel ? `<p class="text-xs mt-1" style="color:#1a4d3a">💰 Aluguel cadastrado: ${formatBRL(im.aluguel)} · vence dia ${im.dia_vencimento || 5}</p>` : ''}
        </div>
        <button onclick="fecharDetalheImovel()">${icons.x}</button>
      </div>

      <div class="p-6 space-y-6">
        <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
          <div class="rounded-lg p-4" style="background:#f5f1e8">
            <div class="text-xs uppercase tracking-wider font-semibold" style="color:#5d4037">Receita ${d.anoAtual}</div>
            <div class="num-mono text-xl font-bold mt-1 accent">${formatBRL(im.receitaAno)}</div>
            <div class="text-xs text-stone-500 mt-1">Mês: ${formatBRL(im.receitaMes)}</div>
          </div>
          <div class="rounded-lg p-4" style="background:#f5f1e8">
            <div class="text-xs uppercase tracking-wider font-semibold" style="color:#5d4037">Despesa ${d.anoAtual}</div>
            <div class="num-mono text-xl font-bold mt-1" style="color:#8b3a3a">${formatBRL(im.despesaAno)}</div>
            <div class="text-xs text-stone-500 mt-1">Mês: ${formatBRL(im.despesaMes)}</div>
          </div>
          <div class="rounded-lg p-4" style="background:linear-gradient(135deg,#1a4d3a,#2e6b52);color:#fdfbf6">
            <div class="text-xs uppercase tracking-wider opacity-80 font-semibold">Resultado ${d.anoAtual}</div>
            <div class="num-mono text-xl font-bold mt-1">${formatBRL(im.resultadoAno)}</div>
            <div class="text-xs opacity-80 mt-1">Mês: ${formatBRL(im.resultadoMes)}</div>
          </div>
          <div class="rounded-lg p-4" style="background:#f5f1e8">
            <div class="text-xs uppercase tracking-wider font-semibold" style="color:#5d4037">Margem operacional</div>
            <div class="num-mono text-xl font-bold mt-1" style="color:${im.margemAno === null ? '#94a3b8' : im.margemAno >= 50 ? '#16a34a' : im.margemAno >= 0 ? '#ca8a04' : '#c62828'}">${im.margemAno !== null ? im.margemAno.toFixed(1) + '%' : '—'}</div>
            <div class="text-xs text-stone-500 mt-1">do ano ${d.anoAtual}</div>
          </div>
        </div>

        ${tiposOrd.length > 0 ? `
        <div>
          <h4 class="titulo-serif text-xl font-bold mb-3" style="color:#1a3a2a">Despesas por Tipo</h4>
          <div class="card rounded-xl p-4">
            <div class="space-y-2">
              ${tiposOrd.map(([tipo, val]) => {
                const max = Math.max(...tiposOrd.map(x => x[1]), 1);
                const pct = val / max * 100;
                return `<div>
                  <div class="flex justify-between text-sm mb-1">
                    <span class="font-semibold" style="color:#1a3a2a">${escapeHtml(tipo)}</span>
                    <span class="num-mono font-bold" style="color:#8b3a3a">${formatBRL(val)}</span>

                  </div>
                </div>`;
              }).join('')}
            </div>
          </div>
        </div>
        ` : ''}

        <div>
          <h4 class="titulo-serif text-xl font-bold mb-3" style="color:#1a3a2a">Histórico Mensal</h4>
          <div class="card rounded-xl overflow-hidden overflow-x-auto">
            <table class="w-full text-sm">
              <thead style="background:#1a4d3a">
                <tr>
                  <th class="text-left px-4 py-2 text-xs uppercase tracking-wider font-semibold text-amber-50">Mês/Ano</th>
                  <th class="text-right px-4 py-2 text-xs uppercase tracking-wider font-semibold text-amber-50">Receita</th>
                  <th class="text-right px-4 py-2 text-xs uppercase tracking-wider font-semibold text-amber-50">Despesa</th>
                  <th class="text-right px-4 py-2 text-xs uppercase tracking-wider font-semibold text-amber-50">Resultado</th>
                </tr>
              </thead>
              <tbody>
                ${mesesOrd.map((m, idx) => {
                  const result = m.receita - m.despesa;
                  return `<tr class="${idx % 2 === 0 ? 'bg-amber-50/30' : ''}" style="border-bottom:1px solid #e8dfc9">
                    <td class="px-4 py-2 font-semibold" style="color:#1a3a2a">${MESES[m.mes-1]}/${m.ano}</td>
                    <td class="px-4 py-2 text-right num-mono ${m.receita > 0 ? 'accent font-semibold' : 'text-stone-300'}">${m.receita > 0 ? formatBRL(m.receita) : '—'}</td>
                    <td class="px-4 py-2 text-right num-mono ${m.despesa > 0 ? '' : 'text-stone-300'}" style="${m.despesa > 0 ? 'color:#8b3a3a' : ''}">${m.despesa > 0 ? formatBRL(m.despesa) : '—'}</td>
                    <td class="px-4 py-2 text-right num-mono font-bold" style="color:${result >= 0 ? '#1a4d3a' : '#8b3a3a'}">${formatBRL(result)}</td>

              </tbody>
            </table>

        </div>

        ${ultDesp.length > 0 ? `
        <div>
          <h4 class="titulo-serif text-xl font-bold mb-3" style="color:#1a3a2a">Últimas Despesas</h4>
          <div class="card rounded-xl overflow-hidden overflow-x-auto">
            <table class="w-full text-sm">
              <thead style="background:#1a4d3a">
                <tr>
                  <th class="text-left px-4 py-2 text-xs uppercase tracking-wider font-semibold text-amber-50">Tipo</th>
                  <th class="text-center px-4 py-2 text-xs uppercase tracking-wider font-semibold text-amber-50">Vencimento</th>
                  <th class="text-right px-4 py-2 text-xs uppercase tracking-wider font-semibold text-amber-50">Valor</th>
                  <th class="text-center px-4 py-2 text-xs uppercase tracking-wider font-semibold text-amber-50">Status</th>
                </tr>
              </thead>
              <tbody>
                ${ultDesp.map((x, idx) => `<tr class="${idx % 2 === 0 ? 'bg-amber-50/30' : ''}" style="border-bottom:1px solid #e8dfc9">
                  <td class="px-4 py-2" style="color:#1a3a2a">${escapeHtml(x.tipo)} ${x.pago_por === 'inquilino' ? '<span class="pill" style="background:#dbeafe;color:#1e3a5f;border:1px solid #93c5fd;margin-left:4px">🏠 Inquilino</span>' : ''}</td>
                  <td class="px-4 py-2 text-center num-mono">${String(x.dia_venc).padStart(2,'0')}/${String(x.mes).padStart(2,'0')}/${x.ano}</td>
                  <td class="px-4 py-2 text-right num-mono font-semibold" style="color:#8b3a3a">${formatBRL(x.valor)}</td>
                  <td class="px-4 py-2 text-center"><span class="pill ${x.status === 'pago' ? 'badge-pago' : 'badge-urgente'}">${x.status}</span></td>
                </tr>`).join('')}

            </table>

      <div class="flex justify-between items-center gap-3 p-6 border-t flex-wrap" style="border-color:#e8dfc9">

          <button onclick="fecharDetalheImovel(); editarImovel('${imOriginal ? imOriginal.id : ''}')" class="px-5 py-2 rounded-md text-sm font-semibold" style="background:#f5f1e8;color:#1a3a2a">${icons.edit} Editar imóvel</button>

        <button onclick="fecharDetalheImovel()" class="px-5 py-2 rounded-md text-sm font-semibold text-amber-50 accent-bg">Fechar</button>
      </div>
    </div>
  </div>`;

// Funções de storage pra documentos (usa o mesmo Firebase Storage, pasta diferente)
async function listarDocumentos(imovelId, categoriaId) {
  try {
    const st = window.firebaseStorage;
    const folderRef = st.ref(st.storage, `${STORAGE_PASTA}/documentos/${imovelId}/${categoriaId}`);
    const result = await st.listAll(folderRef);
    const anexos = await Promise.all(
      result.items.map(async (itemRef) => {
        const url = await st.getDownloadURL(itemRef);
        return { nome: itemRef.name, url, fullPath: itemRef.fullPath };
      })
    );
    const key = `doc_${imovelId}_${categoriaId}`;
    state.anexosCache[key] = anexos;
    state.anexosCount[key] = anexos.length;
    return anexos;
  } catch (e) {
    console.error("Erro ao listar documentos:", e);
    const key = `doc_${imovelId}_${categoriaId}`;
    state.anexosCache[key] = [];
    state.anexosCount[key] = 0;
    return [];
  }
}

async function uploadDocumento(imovelId, categoriaId, file) {
  if (file.size > 10 * 1024 * 1024) {
    alert("Arquivo muito grande! Limite de 10MB.");
    return false;
  }
  try {
    state.uploadProgresso = true;
    render();
    const st = window.firebaseStorage;
    const nomeSeguro = file.name.replace(/[^a-zA-Z0-9.\-_]/g, "_");
    const nomeArquivo = `${Date.now()}_${nomeSeguro}`;
    const fileRef = st.ref(st.storage, `${STORAGE_PASTA}/documentos/${imovelId}/${categoriaId}/${nomeArquivo}`);
    await st.uploadBytes(fileRef, file);
    await listarDocumentos(imovelId, categoriaId);
    state.uploadProgresso = false;
    render();
    return true;
  } catch (e) {
    state.uploadProgresso = false;
    alert("Erro ao enviar arquivo: " + e.message);
    render();
    return false;
  }
}

async function deletarDocumento(imovelId, categoriaId, fullPath) {
  if (!confirm("Apagar este documento? Não dá pra recuperar depois.")) return;
  try {
    const st = window.firebaseStorage;
    const fileRef = st.ref(st.storage, fullPath);
    await st.deleteObject(fileRef);
    await listarDocumentos(imovelId, categoriaId);
    render();
  } catch (e) { alert("Erro ao apagar: " + e.message); }
}

// Contagem inicial de documentos por imóvel (só total, sem detalhes)
async function carregarContagemDocumentos() {
  try {
    const st = window.firebaseStorage;
    for (const im of state.imoveis) {
      for (const cat of CATEGORIAS_DOC) {
        try {
          const folderRef = st.ref(st.storage, `${STORAGE_PASTA}/documentos/${im.id}/${cat.id}`);
          const result = await st.listAll(folderRef);
          state.anexosCount[`doc_${im.id}_${cat.id}`] = result.items.length;
        } catch (e) {
          state.anexosCount[`doc_${im.id}_${cat.id}`] = 0;
        }
      }
    }
    render();
  } catch (e) {
    console.error("Erro ao contar documentos:", e);
  }
}

window.exportarCalendario = () => {
  const d = getDados();
  let ics = 'BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//MilleMiglia//PT-BR//\r\n';
  d.proximosVencimentos.forEach(v => {
    const data = v.dataVenc;
    const ano = data.getFullYear();
    const mes = String(data.getMonth() + 1).padStart(2, '0');
    const dia = String(data.getDate()).padStart(2, '0');
    ics += 'BEGIN:VEVENT\r\n';
    ics += `UID:${v.id}-${ano}${mes}${dia}@millemiglia\r\n`;
    ics += `DTSTART;VALUE=DATE:${ano}${mes}${dia}\r\n`;
    ics += `DTEND;VALUE=DATE:${ano}${mes}${dia}\r\n`;
    ics += `SUMMARY:💰 ${v.tipo} - ${v.imovel} - ${formatBRL(v.valor)}\r\n`;
    ics += `DESCRIPTION:Vencimento de ${v.tipo} do imóvel ${v.imovel}. Valor: ${formatBRL(v.valor)}\r\n`;
    ics += 'BEGIN:VALARM\r\nTRIGGER:-P3D\r\nACTION:DISPLAY\r\nDESCRIPTION:Vencimento em 3 dias\r\nEND:VALARM\r\n';
    ics += 'BEGIN:VALARM\r\nTRIGGER:-P1D\r\nACTION:DISPLAY\r\nDESCRIPTION:Vencimento amanhã\r\nEND:VALARM\r\n';
    ics += 'END:VEVENT\r\n';
  });
  ics += 'END:VCALENDAR';
  const blob = new Blob([ics], { type: 'text/calendar' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'vencimentos-gestao-imoveis.ics'; a.click();
  URL.revokeObjectURL(url);
};

// === FINANCEIRO (início) ===
// Regras de dinheiro da imobiliária, sem tela e sem Firebase (o robô do mês e os testes usam este mesmo bloco).
//   • Plano de contas por natureza (locação, venda, outras; impostos, comissões, marketing, fixas...)
//   • Parcelas a receber geradas pelos contratos (aluguel todo mês, comissão de venda parcelada)
//   • Baixa de parcela: o que vira receita da empresa e o que é dinheiro de terceiros (repasse ao proprietário)
//   • Relatórios: DRE, fluxo de caixa, conta de terceiros, inadimplência, comissões, extrato do proprietário
const Financeiro = (() => {
  const PLANO = [
    { id: 'rec_aluguel',    cod: '1.1', grupo: 'receita',   natureza: 'locacao',  nome: 'Aluguel de imóvel próprio' },
    { id: 'rec_adm',        cod: '1.2', grupo: 'receita',   natureza: 'locacao',  nome: 'Taxa de administração' },
    { id: 'rec_1locacao',   cod: '1.3', grupo: 'receita',   natureza: 'locacao',  nome: 'Taxa da 1ª locação' },
    { id: 'rec_venda',      cod: '1.4', grupo: 'receita',   natureza: 'venda',    nome: 'Comissão de venda (intermediação)' },
    { id: 'rec_vistoria',   cod: '1.5', grupo: 'receita',   natureza: 'outras',   nome: 'Vistoria e laudos' },
    { id: 'rec_outras',     cod: '1.9', grupo: 'receita',   natureza: 'outras',   nome: 'Outras receitas' },
    { id: 'desp_impostos',  cod: '2.1', grupo: 'despesa',   natureza: 'impostos', nome: 'Impostos' },
    { id: 'desp_corretor',  cod: '2.2', grupo: 'despesa',   natureza: 'comissoes', nome: 'Comissão de corretores' },
    { id: 'desp_marketing', cod: '2.3', grupo: 'despesa',   natureza: 'marketing', nome: 'Marketing e portais' },
    { id: 'desp_fixas',     cod: '2.4', grupo: 'despesa',   natureza: 'fixas',    nome: 'Fixas (aluguel, folha, sistemas)' },
    { id: 'desp_imovel',    cod: '2.5', grupo: 'despesa',   natureza: 'imoveis',  nome: 'Custos dos imóveis (condomínio, IPTU, manutenção)' },
    { id: 'desp_financeiro',cod: '2.6', grupo: 'despesa',   natureza: 'financeiro', nome: 'Financiamento e consórcio' },
    { id: 'desp_outras',    cod: '2.9', grupo: 'despesa',   natureza: 'outras',   nome: 'Outras despesas' },
    { id: 'ter_recebido',   cod: '3.1', grupo: 'terceiros', natureza: 'terceiros', nome: 'Recebido do inquilino (dinheiro do proprietário)' },
    { id: 'ter_repasse',    cod: '3.2', grupo: 'terceiros', natureza: 'terceiros', nome: 'Repasse ao proprietário' },
  ];
  const NATUREZAS = {
    locacao: 'Locação', venda: 'Venda', outras: 'Outras', impostos: 'Impostos', comissoes: 'Comissões',
    marketing: 'Marketing e portais', fixas: 'Despesas fixas', imoveis: 'Custos dos imóveis', financeiro: 'Financeiro', terceiros: 'Terceiros',
  };
  const conta = id => PLANO.find(p => p.id === id);
  const semAcento = s => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
  const r2 = v => Math.round((Number(v) || 0) * 100) / 100;
  const pad = n => String(n).padStart(2, '0');
  const chaveMes = (ano, mes) => `${ano}-${pad(mes)}`;
  const somarMes = ({ mes, ano }, n) => { const t = ano * 12 + (mes - 1) + n; return { mes: (t % 12) + 1, ano: Math.floor(t / 12) }; };
  const ultimoDia = (ano, mes) => new Date(ano, mes, 0).getDate();
  const diaNoMes = (ano, mes, dia) => Math.min(Math.max(1, Number(dia) || 1), ultimoDia(ano, mes));

  // Lançamentos antigos não têm categoria: deduz pelo tipo da despesa (ou "aluguel" para receitas).
  function categoriaDespesa(d) {
    if (d.categoria && conta(d.categoria)) return d.categoria;
    const t = semAcento(d.tipo);
    if (/comiss|corretor/.test(t)) return 'desp_corretor';
    if (/carne.?leao|imposto|irpj|csll|cofins|\bpis\b|\biss\b|\bdas\b|simples/.test(t)) return 'desp_impostos';
    if (/marketing|portal|anuncio|zap|viva ?real|olx|propaganda/.test(t)) return 'desp_marketing';
    if (/financ|consorcio|emprestimo/.test(t)) return 'desp_financeiro';
    if (/condom|iptu|manuten|reforma|seguro|\bluz\b|energia|agua|internet|\bgas\b|taxa adm|vistoria|pintura|limpeza/.test(t)) return 'desp_imovel';
    if (/folha|salario|sistema|software|contador|contabil|aluguel|escritorio|telefone/.test(t)) return 'desp_fixas';
    return 'desp_outras';
  }
  function categoriaReceita(r) {
    if (r.categoria && conta(r.categoria)) return r.categoria;
    return r.terceiros ? 'ter_recebido' : 'rec_aluguel';
  }
  const ehTerceiros = (x, ehDespesa) => !!x.terceiros || (ehDespesa ? categoriaDespesa(x) : categoriaReceita(x)).startsWith('ter_');
  // Despesa que o inquilino paga direto não sai do caixa da empresa.
  const despesaDaEmpresa = d => !ehTerceiros(d, true) && d.pago_por !== 'inquilino';

  // Contrato de locação ativo no mês?
  function locacaoNoMes(c, { mes, ano }) {
    if (c.tipo !== 'locacao' || c.ativo === false) return false;
    const k = chaveMes(ano, mes);
    if (c.inicio && k < c.inicio) return false;
    if (c.fim && k > c.fim) return false;
    return true;
  }

  // Parcelas de aluguel que faltam no mês (id fixo por contrato + mês, então nunca duplica).
  function planejarParcelas(contratos, parcelas, alvo) {
    const existentes = new Set(parcelas.map(p => p.id));
    const novas = [];
    for (const c of contratos) {
      if (!locacaoNoMes(c, alvo)) continue;
      const id = `${c.id}_${chaveMes(alvo.ano, alvo.mes)}`;
      if (existentes.has(id)) continue;
      const aluguel = r2(c.aluguel), encargos = r2(c.encargos);
      if (aluguel + encargos <= 0) continue;
      const dia = diaNoMes(alvo.ano, alvo.mes, c.dia_vencimento);
      const itens = [{ descricao: 'Aluguel', valor: aluguel }];
      if (encargos > 0) itens.push({ descricao: c.encargos_desc || 'Encargos (condomínio/IPTU)', valor: encargos });
      novas.push({
        id, contrato_id: c.id, tipo: 'locacao', imovel: c.imovel || '', empresa: c.empresa || '',
        cliente_id: c.cliente_id || '', cliente_nome: c.cliente_nome || '',
        proprietario_id: c.terceiros ? (c.proprietario_id || '') : '', terceiros: !!c.terceiros,
        descricao: `Aluguel ${pad(alvo.mes)}/${alvo.ano}`,
        mes: alvo.mes, ano: alvo.ano, dia_venc: dia, vencimento: `${chaveMes(alvo.ano, alvo.mes)}-${pad(dia)}`,
        valor: r2(aluguel + encargos), itens, status: 'pendente',
      });
    }
    return novas;
  }

  // Comissão de uma venda dividida em parcelas mensais a partir do 1º vencimento.
  function parcelasVenda(c) {
    const total = r2((Number(c.valor_venda) || 0) * (Number(c.comissao_pct) || 0) / 100);
    const n = Math.max(1, parseInt(c.parcelas) || 1);
    if (total <= 0) return [];
    const [a0, m0, d0] = String(c.primeiro_venc || '').split('-').map(Number);
    const base = a0 && m0 ? { ano: a0, mes: m0 } : null;
    if (!base) return [];
    const cada = Math.floor(total / n * 100) / 100;
    const out = [];
    for (let i = 0; i < n; i++) {
      const { mes, ano } = somarMes(base, i);
      const dia = diaNoMes(ano, mes, d0);
      const valor = i === n - 1 ? r2(total - cada * (n - 1)) : cada;
      out.push({
        id: `${c.id}_p${i + 1}`, contrato_id: c.id, tipo: 'venda', imovel: c.imovel || '', empresa: c.empresa || '',
        cliente_id: c.cliente_id || '', cliente_nome: c.cliente_nome || '', proprietario_id: '', terceiros: false,
        descricao: `Comissão de venda ${i + 1}/${n}`, numero: i + 1, de: n,
        mes, ano, dia_venc: dia, vencimento: `${chaveMes(ano, mes)}-${pad(dia)}`,
        valor, itens: [{ descricao: 'Comissão de venda', valor }], status: 'pendente',
      });
    }
    return out;
  }

  // Ao receber uma parcela: o que gravar em receitas e em despesas.
  //   Imóvel próprio → receita de aluguel da empresa.
  //   Imóvel de terceiro → entrada na conta de terceiros, taxa (adm ou 1ª locação) vira receita da empresa
  //                        e o resto vira um repasse a pagar ao proprietário.
  //   Venda → comissão vira receita e a parte do corretor vira comissão a pagar.
  function baixaParcela(p, c, { data, valor }) {
    c = c || {};
    const [ano, mes, dia] = String(data).split('-').map(Number);
    const pago = r2(valor ?? p.valor);
    const ref = { parcela_id: p.id, contrato_id: p.contrato_id || '', imovel: p.imovel || '', mes, ano, recebido_em: data, origem: 'parcela' };
    const receitas = [], despesas = [];
    if (p.tipo === 'venda') {
      receitas.push({ ...ref, categoria: 'rec_venda', valor: pago });
      const pct = Number(c.corretor_pct) || 0;
      if (c.corretor_id && pct > 0) {
        despesas.push({
          imovel: p.imovel || '', tipo: 'Comissão de corretor', categoria: 'desp_corretor', corretor_id: c.corretor_id,
          mes, ano, dia_venc: dia, valor: r2(pago * pct / 100), status: 'pendente', pago_por: 'empresa',
          recorrente: false, confirmar_valor: false, parcela_id: p.id, contrato_id: p.contrato_id || '', origem: 'parcela',
        });
      }
      return { receitas, despesas };
    }
    if (!p.terceiros) {
      receitas.push({ ...ref, categoria: 'rec_aluguel', valor: pago });
      return { receitas, despesas };
    }
    // Locação de terceiro: a taxa incide só sobre o aluguel (não sobre condomínio/IPTU cobrados junto).
    receitas.push({ ...ref, categoria: 'ter_recebido', terceiros: true, valor: pago, proprietario_id: p.proprietario_id || '' });
    const aluguelPrev = r2((p.itens || []).filter(i => i.descricao === 'Aluguel').reduce((s, i) => s + i.valor, 0)) || p.valor;
    const baseTaxa = p.valor > 0 ? r2(pago * aluguelPrev / p.valor) : pago;
    const primeira = !!c.inicio && chaveMes(p.ano, p.mes) === c.inicio && (Number(c.taxa_1a_pct) || 0) > 0;
    const taxaPct = primeira ? Number(c.taxa_1a_pct) : (Number(c.taxa_adm_pct) || 0);
    const taxa = r2(baseTaxa * taxaPct / 100);
    if (taxa > 0) receitas.push({ ...ref, categoria: primeira ? 'rec_1locacao' : 'rec_adm', valor: taxa, retida: true });
    const repasse = r2(pago - taxa);
    if (repasse > 0) {
      const venc = somarMes({ mes, ano }, (Number(c.dia_repasse) || 0) && Number(c.dia_repasse) < dia ? 1 : 0);
      despesas.push({
        imovel: p.imovel || '', tipo: 'Repasse ao proprietário', categoria: 'ter_repasse', terceiros: true,
        proprietario_id: p.proprietario_id || '', mes: venc.mes, ano: venc.ano,
        dia_venc: diaNoMes(venc.ano, venc.mes, Number(c.dia_repasse) || dia), valor: repasse, status: 'pendente',
        pago_por: 'empresa', recorrente: false, confirmar_valor: false, parcela_id: p.id, contrato_id: p.contrato_id || '', origem: 'parcela',
      });
    }
    return { receitas, despesas };
  }

  // Conta de terceiros: tudo que entrou dos inquilinos menos as taxas da empresa e os repasses já pagos.
  function contaTerceiros(receitas, despesas) {
    const entradas = r2(receitas.filter(r => categoriaReceita(r) === 'ter_recebido').reduce((s, r) => s + Number(r.valor || 0), 0));
    const taxas = r2(receitas.filter(r => r.retida).reduce((s, r) => s + Number(r.valor || 0), 0));
    const rep = despesas.filter(d => categoriaDespesa(d) === 'ter_repasse');
    const repassado = r2(rep.filter(d => d.status === 'pago').reduce((s, d) => s + Number(d.valor || 0), 0));
    const aRepassar = r2(rep.filter(d => d.status !== 'pago').reduce((s, d) => s + Number(d.valor || 0), 0));
    return { entradas, taxas, repassado, aRepassar, saldo: r2(entradas - taxas - repassado) };
  }

  // DRE do período (mês opcional). Fica de fora: dinheiro de terceiros e despesa paga direto pelo inquilino.
  function dre(receitas, despesas, { ano, mes }) {
    const noPeriodo = x => x.ano === ano && (!mes || x.mes === mes);
    const soma = (lista, f) => {
      const m = {};
      for (const x of lista) { const k = f(x); m[k] = r2((m[k] || 0) + Number(x.valor || 0)); }
      return m;
    };
    const rec = soma(receitas.filter(r => noPeriodo(r) && !ehTerceiros(r, false)), categoriaReceita);
    const desp = soma(despesas.filter(d => noPeriodo(d) && despesaDaEmpresa(d)), categoriaDespesa);
    const linhas = ids => ids.map(id => ({ ...conta(id), valor: rec[id] || desp[id] || 0 }));
    const tot = l => r2(l.reduce((s, x) => s + x.valor, 0));
    const receitaPorNat = {};
    for (const p of PLANO.filter(p => p.grupo === 'receita')) receitaPorNat[p.natureza] = r2((receitaPorNat[p.natureza] || 0) + (rec[p.id] || 0));
    const receitaBruta = linhas(PLANO.filter(p => p.grupo === 'receita').map(p => p.id));
    const impostos = linhas(['desp_impostos']);
    const custos = linhas(['desp_corretor']);
    const operacionais = linhas(['desp_marketing', 'desp_fixas', 'desp_imovel', 'desp_outras']);
    const financeiro = linhas(['desp_financeiro']);
    const rb = tot(receitaBruta), rl = r2(rb - tot(impostos)), lb = r2(rl - tot(custos));
    const ro = r2(lb - tot(operacionais)), res = r2(ro - tot(financeiro));
    return {
      receitaBruta, impostos, custos, operacionais, financeiro, receitaPorNat,
      totais: { receitaBruta: rb, impostos: tot(impostos), receitaLiquida: rl, custos: tot(custos), lucroBruto: lb,
        operacionais: tot(operacionais), resultadoOperacional: ro, financeiro: tot(financeiro), resultado: res,
        margem: rb > 0 ? r2(res / rb * 100) : null },
    };
  }

  // Fluxo de caixa mês a mês: realizado (o que entrou/saiu) e previsto (o que ainda está para entrar/sair).
  function fluxoCaixa({ receitas, despesas, parcelas, contratos = [], ano }) {
    const cs = Object.fromEntries(contratos.map(c => [c.id, c]));
    const meses = [];
    let acumulado = 0;
    for (let mes = 1; mes <= 12; mes++) {
      const doMes = x => x.ano === ano && x.mes === mes;
      const entrou = r2(receitas.filter(r => doMes(r) && !ehTerceiros(r, false)).reduce((s, r) => s + Number(r.valor || 0), 0));
      const saiu = r2(despesas.filter(d => doMes(d) && despesaDaEmpresa(d) && d.status === 'pago').reduce((s, d) => s + Number(d.valor || 0), 0));
      // Parcela de imóvel de terceiro: para o caixa da empresa só conta a taxa.
      const aEntrar = r2(parcelas.filter(p => doMes(p) && p.status === 'pendente').reduce((s, p) => {
        if (!p.terceiros) return s + Number(p.valor || 0);
        const c = cs[p.contrato_id] || {};
        const aluguel = (p.itens || []).filter(i => i.descricao === 'Aluguel').reduce((t, i) => t + i.valor, 0);
        return s + aluguel * (Number(c.taxa_adm_pct) || 0) / 100;
      }, 0));
      const aSair = r2(despesas.filter(d => doMes(d) && despesaDaEmpresa(d) && d.status !== 'pago').reduce((s, d) => s + Number(d.valor || 0), 0));
      const saldo = r2(entrou - saiu + aEntrar - aSair);
      acumulado = r2(acumulado + saldo);
      meses.push({ mes, entrou, saiu, aEntrar, aSair, saldoRealizado: r2(entrou - saiu), saldo, acumulado });
    }
    return meses;
  }

  // Parcelas vencidas e não pagas, com dias de atraso e faixa.
  function inadimplencia(parcelas, hoje) {
    const h = typeof hoje === 'string' ? hoje : `${hoje.getFullYear()}-${pad(hoje.getMonth() + 1)}-${pad(hoje.getDate())}`;
    const dias = (a, b) => Math.round((new Date(a + 'T12:00:00') - new Date(b + 'T12:00:00')) / 864e5);
    const lista = parcelas.filter(p => p.status === 'pendente' && p.vencimento && p.vencimento < h)
      .map(p => { const atraso = dias(h, p.vencimento); return { ...p, atraso, faixa: atraso <= 30 ? '1–30 dias' : atraso <= 60 ? '31–60 dias' : atraso <= 90 ? '61–90 dias' : 'mais de 90 dias' }; })
      .sort((a, b) => b.atraso - a.atraso);
    const faixas = ['1–30 dias', '31–60 dias', '61–90 dias', 'mais de 90 dias'].map(f => {
      const l = lista.filter(p => p.faixa === f);
      return { faixa: f, qtd: l.length, valor: r2(l.reduce((s, p) => s + Number(p.valor || 0), 0)) };
    });
    return { lista, faixas, total: r2(lista.reduce((s, p) => s + Number(p.valor || 0), 0)) };
  }

  // Comissões de corretores: a pagar e pagas, por corretor.
  function comissoes(despesas, pessoas = []) {
    const nome = id => (pessoas.find(p => p.id === id) || {}).nome || 'Sem corretor';
    const m = {};
    for (const d of despesas.filter(d => categoriaDespesa(d) === 'desp_corretor')) {
      const k = d.corretor_id || '';
      m[k] = m[k] || { corretor_id: k, nome: nome(k), aPagar: 0, pago: 0, itens: [] };

      + td([p.whatsapp, p.email].filter(Boolean).map(escapeHtml).join('<br>') || '—', 'text-xs text-stone-600')
      + td(escapeHtml(p.pix || '—'), 'text-xs text-stone-600')
      + td(nContratos || '—', 'text-center num-mono')
      + td(`<div class="flex gap-2 justify-end"><button onclick="editarPessoa('${p.id}')" class="p-1.5 rounded hover:bg-amber-100" title="Editar">${icons.edit}</button><button onclick="removerPessoa('${p.id}')" class="p-1.5 rounded hover:bg-red-100 text-red-700" title="Remover">${icons.trash}</button></div>`);
  });
  return `<main class="max-w-7xl mx-auto px-6 py-6"><div class="space-y-6">
    ${titulo('Pessoas', 'Proprietários, inquilinos, compradores e corretores. Uma pessoa pode ter mais de um papel.', botao(icons.plus + ' Nova pessoa', 'abrirModalPessoa()', true))}
    ${tabela(th('Nome') + th('Papel') + th('Contato') + th('Pix / banco') + th('Contratos', 'center') + '<th></th>', linhas, 'Ninguém cadastrado ainda. As pessoas também são criadas sozinhas quando você digita um nome novo no contrato.', 6)}
  </div></main>`;
}
